backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "hotels"
    label: "Hotels"
    folder: "src/content/hotels"
    create: true
    extension: "md"
    format: "yaml-frontmatter"
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Short Location", name: "location", widget: "string", required: false }
      - { label: "Full Address", name: "fullAddress", widget: "string", required: false }
      - { label: "Price (BDT)", name: "priceBDT", widget: "string", required: false }
      - { label: "Price (USD)", name: "priceUSD", widget: "string", required: false }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", required: false }
      - { label: "Reviews Count", name: "reviewsCount", widget: "string", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "WhatsApp Number", name: "whatsapp", widget: "string", required: false }
      - { label: "Official Website", name: "officialWebsite", widget: "string", required: false }
      - { label: "Editor Note / Short Summary", name: "editorNote", widget: "text", required: false }

      # --- Show/Hide Controls ---
      - { label: "Show Category Badge?", name: "showCategory", widget: "boolean", default: true, required: false }
      - { label: "Show Location Section?", name: "showLocation", widget: "boolean", default: true, required: false }
      - { label: "Show Rating?", name: "showRating", widget: "boolean", default: true, required: false }
      - { label: "Show Description?", name: "showDescription", widget: "boolean", default: true, required: false }
      - { label: "Show Check Price Button?", name: "showCheckPrice", widget: "boolean", default: true, required: false }
      - { label: "Show Details Button?", name: "showDetailsBtn", widget: "boolean", default: true, required: false }
