backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  # 1. HOTELS DIRECTORY (Individual Hotel Pages)
  - name: "hotels"
    label: "🏨 Hotels Directory"
    folder: "src/content/hotels"
    create: true
    slug: "{{title}}"
    summary: "{{title}} - Link: /{{slug}}"
    fields:
      - { label: "Hotel Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "string", default: "5-Star Luxury Stay" }
      - { label: "Location", name: "location", widget: "string", default: "Gulshan 2, Dhaka" }
      - { label: "Starting Price", name: "price", widget: "string", default: "$120 / night" }
      - { label: "Rating", name: "rating", widget: "number", value_type: "float", required: false }
      - { label: "Reviews Count", name: "reviewsCount", widget: "number", required: false }
      - { label: "Show in Popular Hotels?", name: "popular", widget: "boolean", default: true }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", widget: "image" }, required: false }
      - { label: "Show OTA Rate Comparison Table?", name: "enable_rates", widget: "boolean", default: true }
      - { label: "Official Hotel Website Link", name: "officialSite", widget: "string", required: false }
      - { label: "WhatsApp Reservation Number", name: "whatsapp", widget: "string", required: false }
      - { label: "Direct Phone Number", name: "phone", widget: "string", required: false }
      - { label: "Show Amenities Section?", name: "enable_amenities", widget: "boolean", default: true }
      - { label: "Show What's Nearby?", name: "enable_nearby", widget: "boolean", default: true }
      - { label: "Show Essential Details?", name: "enable_details", widget: "boolean", default: true }
      - { label: "Show House Rules?", name: "enable_rules", widget: "boolean", default: true }
      - { label: "Show FAQs?", name: "enable_faqs", widget: "boolean", default: true }

      - label: "Amenities List"
        name: "amenities"
        widget: "list"
        required: false
        field:
          label: "Amenity Name"
          widget: "string"

      - label: "Nearby Places"
        name: "nearby_places"
        widget: "list"
        required: false
        fields:
          - label: "Place Name"
            name: "name"
            widget: "string"
          - label: "Distance"
            name: "distance"
            widget: "string"

      - label: "Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - label: "Question"
            name: "question"
            widget: "string"
          - label: "Answer"
            name: "answer"
            widget: "text"

      - label: "Custom Additional Sections"
        name: "custom_sections"
        widget: "list"
        required: false
        fields:
          - label: "Section Title"
            name: "title"
            widget: "string"
          - label: "Section Content"
            name: "content"
            widget: "markdown"

      - label: "Hotel Description"
        name: "body"
        widget: "markdown"

  # 2. HOMEPAGE SECTIONS (Allows Unlimited New Sections via + Button)
  - name: "homepage_sections"
    label: "📄 Homepage Sections"
    folder: "src/content/homepage"
    create: true
    slug: "{{title}}"
    summary: "{{title}}"
    fields:
      - { label: "Show Section on Homepage?", name: "enable", widget: "boolean", default: true }
      - { label: "Section Badge Text", name: "badge", widget: "string", required: false }
      - { label: "Section Title", name: "title", widget: "string" }
      - { label: "Section Subtitle / Description", name: "subtitle", widget: "string", required: false }
      - { label: "Section Body Content", name: "body", widget: "markdown", required: false }
