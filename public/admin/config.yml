collections:
  - name: "hotels"
    label: "Hotels"
    folder: "src/content/hotels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }

      # --- Category Badge Controls ---
      - { label: "Show Category Badge?", name: "showCategory", widget: "boolean", default: true }
      - { label: "Category Text (e.g., 5-Star Luxury, Budget Stay)", name: "category", widget: "string", required: false }

      # --- Location Controls ---
      - { label: "Show Location Section?", name: "showLocation", widget: "boolean", default: true }
      - { label: "Short Location (e.g., Gulshan 2, Dhaka)", name: "location", widget: "string", required: false }
      - { label: "Detailed Address / Review Snippet (Optional)", name: "locationDetail", widget: "string", required: false }

      # --- Rating Controls ---
      - { label: "Show Rating?", name: "showRating", widget: "boolean", default: true }
      - { label: "Rating (e.g., 4.8)", name: "rating", widget: "string", required: false }

      # --- Description Controls ---
      - { label: "Show Description?", name: "showDescription", widget: "boolean", default: true }
      - { label: "Description", name: "description", widget: "text", required: false }

      # --- Button Controls ---
      - { label: "Show Check Price Button?", name: "showCheckPrice", widget: "boolean", default: true }
      - { label: "Show Details Button?", name: "showDetailsBtn", widget: "boolean", default: true }
