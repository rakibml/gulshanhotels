backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "hotels"
    label: "Hotels Directory"
    folder: "src/content/hotels"
    create: true
    slug: "{{title}}"
    fields:
      - label: "Hotel Title"
        name: "title"
        widget: "string"
      - label: "Category"
        name: "category"
        widget: "string"
        default: "5-Star Luxury Stay"
      - label: "Location"
        name: "location"
        widget: "string"
        default: "Gulshan 2, Dhaka"
      - label: "Starting Price"
        name: "price"
        widget: "string"
        default: "$120 / night"
      - label: "Rating"
        name: "rating"
        widget: "number"
        value_type: "float"
        required: false
      - label: "Reviews Count"
        name: "reviewsCount"
        widget: "number"
        required: false
      - label: "Show in Popular Hotels?"
        name: "popular"
        widget: "boolean"
        default: true
      - label: "Cover Image"
        name: "image"
        widget: "image"
      - label: "Hotel Description"
        name: "body"
        widget: "markdown"

  - name: "homepage_sections"
    label: "Homepage Sections"
    files:
      - label: "Popular Hotels Section"
        name: "popular_hotels"
        file: "src/content/homepage/popular-hotels.json"
        fields:
          - label: "Enable Popular Section?"
            name: "enable"
            widget: "boolean"
            default: true
          - label: "Section Badge"
            name: "badge"
            widget: "string"
            default: "POPULAR ACCOMMODATIONS"
          - label: "Section Title"
            name: "title"
            widget: "string"
            default: "Popular Hotels in Gulshan"
          - label: "Section Subtitle"
            name: "subtitle"
            widget: "string"
            default: "Handpicked luxury and executive hotels recommended by our local audit team."
