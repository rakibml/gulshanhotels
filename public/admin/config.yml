backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images/hotels"
public_folder: "/images/hotels"

collections:
  - name: "hotels"
    label: "🏨 Hotels Directory"
    folder: "src/content/hotels"
    create: true
    slug: "{{title}}"
    summary: "{{title}} - Link: /{{slug}}"
    fields:
      # --- FROM 1-header.yml ---
      - label: "1. HOTEL HEADER & HERO BANNER"
        name: "header_notice"
        widget: "instructions"
        description: "Controls main title, category, location & cover photo."
        required: false

      - label: "Hotel Name / Title"
        name: "title"
        widget: "string"

      - label: "Category (e.g. 5-Star Luxury Stay)"
        name: "category"
        widget: "string"
        default: "5-Star Luxury Stay"

      - label: "Location Address"
        name: "location"
        widget: "string"
        default: "Main Gulshan Avenue, Gulshan 2, Dhaka 1212, Bangladesh"

      - label: "Cover Image"
        name: "image"
        widget: "image"

      - label: "Photo Gallery (Multiple Photos)"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Photo"
          widget: "image"

      - label: "Show in Popular Hotels Carousel?"
        name: "popular"
        widget: "boolean"
        default: true

      # --- FROM 2-about-rates.yml ---
      - label: "2. ABOUT HOTEL & LIVE STAY22 RATES"
        name: "about_notice"
        widget: "instructions"
        description: "Controls overview description, price & booking channels."
        required: false

      - label: "Starting Price"
        name: "price"
        widget: "string"
        default: "৳ 18,500 / night"

      - label: "Show Live Stay22 OTA Rate Comparison Table?"
        name: "enable_rates"
        widget: "boolean"
        default: true

      - label: "Official Hotel Website Link (Optional)"
        name: "officialSite"
        widget: "string"
        required: false

      - label: "WhatsApp Reservation Number"
        name: "whatsapp"
        widget: "string"
        required: false

      - label: "Direct Phone Number"
        name: "phone"
        widget: "string"
        required: false

      - label: "Hotel Description / About"
        name: "body"
        widget: "markdown"

      # --- FROM 3-amenities-rooms.yml ---
      - label: "3. AMENITIES & ROOM TYPES"
        name: "amenities_notice"
        widget: "instructions"
        description: "Controls amenities list and room categories."
        required: false

      - label: "Show Amenities Section?"
        name: "enable_amenities"
        widget: "boolean"
        default: true

      - label: "Amenities List"
        name: "amenities"
        widget: "list"
        required: false
        field:
          label: "Amenity Name"
          widget: "string"

      - label: "Available Room Types"
        name: "rooms"
        widget: "list"
        required: false
        fields:
          - label: "Room Name"
            name: "name"
            widget: "string"
          - label: "Price"
            name: "price"
            widget: "string"
          - label: "Max Guests"
            name: "guests"
            widget: "string"
          - label: "Bed Configuration"
            name: "bed"
            widget: "string"
          - label: "Room Size"
            name: "size"
            widget: "string"

      # --- FROM 4-location-map.yml ---
      - label: "4. LOCATION & GOOGLE MAP"
        name: "location_notice"
        widget: "instructions"
        description: "Controls nearby landmarks and driving times."
        required: false

      - label: "Show What's Nearby Section?"
        name: "enable_nearby"
        widget: "boolean"
        default: true

      - label: "Nearby Places & Drive Times"
        name: "nearby_places"
        widget: "list"
        required: false
        fields:
          - label: "Landmark Name"
            name: "name"
            widget: "string"
          - label: "Distance / Time"
            name: "distance"
            widget: "string"

      # --- FROM 5-reviews.yml ---
      - label: "5. GUEST REVIEWS & RATINGS"
        name: "reviews_notice"
        widget: "instructions"
        description: "Controls rating score and total reviews count."
        required: false

      - label: "Rating (e.g. 4.8)"
        name: "rating"
        widget: "number"
        value_type: "float"
        required: false

      - label: "Reviews Count"
        name: "reviewsCount"
        widget: "number"
        required: false

      # --- FROM 6-faqs.yml ---
      - label: "6. FAQS ACCORDION"
        name: "faqs_notice"
        widget: "instructions"
        description: "Controls questions and answers for Google Rich Snippets."
        required: false

      - label: "Show FAQs Section?"
        name: "enable_faqs"
        widget: "boolean"
        default: true

      - label: "Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - label: "Question"
            name: "question"
            widget: "string"
          - label: "Answer"
            name: "answer"
            widget: "text"
