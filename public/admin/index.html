<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GulshanHotels Admin - Sveltia CMS</title>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- ADMIN PANEL CUSTOM STYLING (জগাখিচুড়ি দূর করার জন্য প্রিমিয়াম ডিজাইন) -->
    <style>
      /* সেকশন হেডার ব্যানার স্টাইল */
      .sveltia-section-banner {
        background: linear-gradient(135deg, #064e3b 0%, #022c22 100%) !important;
        border: 1px solid #10b981 !important;
        border-left: 6px solid #34d399 !important;
        border-radius: 12px !important;
        padding: 16px 20px !important;
        margin: 36px 0 16px 0 !important;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45) !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      .sveltia-section-title {
        font-size: 15px !important;
        font-weight: 800 !important;
        color: #ffffff !important;
        letter-spacing: 0.6px !important;
        text-transform: uppercase !important;
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
      }
      .sveltia-section-desc {
        font-size: 12px !important;
        color: #a7f3d0 !important;
        margin-top: 6px !important;
        line-height: 1.4 !important;
        font-weight: 400 !important;
      }

      /* ইনপুট ফিল্ডগুলোর মাঝে পরিষ্কার ডিভাইডার ও স্পেসিং */
      [data-field-type="instructions"] {
        margin-top: 25px !important;
      }
      [data-field-type="instructions"] label {
        display: none !important; /* ডিফল্ট লেবেল হাইড করে ব্যানার বড় করা */
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- UNIVERSAL SMART AUTO-LOADER WITH SECTION HEADERS -->
    <script>
      // ১. কাস্টম instructions ব্যানার উইজেট রেজিস্টার (Sveltia CMS)
      function registerInstructionWidget() {
        const cms = window.CMS || window.SveltiaCMS;
        if (!cms || typeof cms.registerWidget !== 'function') return;

        cms.registerWidget(
          'instructions',
          window.createClass({
            render() {
              const field = this.props.field;
              const label = (field && typeof field.get === 'function' ? field.get('label') : field?.label) || 'Section';
              const desc = (field && typeof field.get === 'function' ? (field.get('description') || field.get('hint')) : (field?.description || field?.hint)) || '';

              return window.h('div', { className: 'sveltia-section-banner' },
                window.h('div', { className: 'sveltia-section-title' }, label),
                desc ? window.h('div', { className: 'sveltia-section-desc' }, desc) : null
              );
            }
          })
        );
      }

      // ২. হেল্পার ফাংশনসমূহ
      function sanitizeSveltiaFields(fields) {
        if (!Array.isArray(fields)) return;
        fields.forEach(f => {
          if (f && typeof f === 'object') {
            if (f.field && typeof f.field === 'object' && !f.field.name) {
              f.field.name = f.field.label
                ? f.field.label.toLowerCase().replace(/[^a-z0-9]/g, '_')
                : (f.name ? f.name + '_item' : 'item');
            }
            if (Array.isArray(f.fields)) sanitizeSveltiaFields(f.fields);
            if (f.field && Array.isArray(f.field.fields)) sanitizeSveltiaFields(f.field.fields);
            if (Array.isArray(f.types)) sanitizeSveltiaFields(f.types);
          }
        });
      }

      function sanitizeCollection(col) {
        if (!col || typeof col !== 'object') return;
        if (Array.isArray(col.fields)) sanitizeSveltiaFields(col.fields);
        if (Array.isArray(col.files)) {
          col.files.forEach(file => {
            if (file && Array.isArray(file.fields)) sanitizeSveltiaFields(file.fields);
          });
        }
      }

      async function loadYaml(url) {
        try {
          const res = await fetch(url);
          if (!res.ok) {
            console.warn('[CMS Loader] ফাইল পাওয়া যায়নি (' + res.status + '):', url);
            return null;
          }
          const text = await res.text();
          return jsyaml.load(text);
        } catch (e) {
          console.warn('[CMS Loader] ফাইল পড়তে সমস্যা:', url, e);
          return null;
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          // কাস্টম ব্যানার উইজেট রেজিস্টার করা
          registerInstructionWidget();

          // ০. মূল config.yml
          const mainRes = await fetch('/admin/config.yml');
          if (!mainRes.ok) {
            throw new Error('/admin/config.yml পাওয়া যায়নি (status ' + mainRes.status + ')');
          }
          const mainText = await mainRes.text();
          const config = jsyaml.load(mainText) || {};
          config.collections = [];

          // ১. হোটেলের ৬টি সেকশনের সংজ্ঞা (টাইটেল ও ডেসক্রিপশনসহ)
          const hotelSections = [
            {
              url: '/admin/collections/hotel/1-header.yml',
              title: '🏨 1. HERO & HEADER SECTION',
              desc: 'Hotel Title, Location Address, Tagline, Cover Image & Photo Gallery'
            },
            {
              url: '/admin/collections/hotel/2-about-rates.yml',
              title: '🏷️ 2. ABOUT HOTEL & LIVE RATES',
              desc: 'Overview Description, Starting Price, Live Booking Channels & WhatsApp/Phone'
            },
            {
              url: '/admin/collections/hotel/3-amenities-rooms.yml',
              title: '🛏️ 3. AMENITIES & ROOM TYPES',
              desc: 'Hotel Amenities, Featured Highlights, Room Categories & Capacities'
            },
            {
              url: '/admin/collections/hotel/4-location-map.yml',
              title: '📍 4. LOCATION & SURROUNDINGS',
              desc: 'Google Maps Embed, Nearby Attractions, Airport Distances & Transportation'
            },
            {
              url: '/admin/collections/hotel/5-reviews.yml',
              title: '⭐ 5. GUEST REVIEWS & RATINGS',
              desc: 'Overall Review Score, Cleanliness/Location Breakdown & Verified Reviews'
            },
            {
              url: '/admin/collections/hotel/6-faqs.yml',
              title: '📋 6. POLICIES & FAQS',
              desc: 'Check-in/out Rules, Extra Bed Policies, Accepted Payments & FAQs'
            }
          ];

          const hotelFields = [];

          for (let i = 0; i < hotelSections.length; i++) {
            const sec = hotelSections[i];
            const fieldsArr = await loadYaml(sec.url);

            if (Array.isArray(fieldsArr) && fieldsArr.length > 0) {
              // সেকশনের শুরুতে কোনো ব্যানার না থাকলে অটোমেটিক যোগ হবে
              const firstField = fieldsArr[0];
              const alreadyHasBanner = firstField && (firstField.widget === 'instructions' || (firstField.name && firstField.name.includes('notice')));

              if (!alreadyHasBanner) {
                hotelFields.push({
                  label: sec.title,
                  name: `sec_banner_${i + 1}`,
                  widget: "instructions",
                  description: sec.desc,
                  required: false
                });
              }

              hotelFields.push(...fieldsArr);
            }
          }

          if (hotelFields.length > 0) {
            sanitizeSveltiaFields(hotelFields);
            config.collections.push({
              name: "hotels",
              label: "🏨 Hotels Directory",
              label_singular: "Hotel",
              folder: "src/content/hotels",
              create: true,
              slug: "{{slug}}",
              summary: "{{title}} - Link: /{{slug}}",
              fields: hotelFields
            });
          }

          // ২. হোমপেজ সেটিংস
          const popFields = await loadYaml('/admin/collections/popular-hotels.yml');
          if (Array.isArray(popFields)) {
            sanitizeSveltiaFields(popFields);
            config.collections.push({
              name: "homepage",
              label: "🏠 Homepage Settings",
              files: [
                {
                  name: "popular_hotels",
                  label: "Popular Hotels Carousel Section",
                  file: "src/content/homepage/popular-hotels.md",
                  fields: popFields
                }
              ]
            });
          }

          // ৩. বাকি সব collection অটো-স্ক্যান
          const allPossibleCollections = [
            'destinations.yml',
            'posts.yml',
            'pages.yml',
            'guest-reviews.yml',
            'subscribers.yml'
          ];

          for (const colFile of allPossibleCollections) {
            let colData = await loadYaml('/admin/collections/' + colFile);
            if (!colData) continue;
            if (Array.isArray(colData)) colData = colData[0];

            if (colData && (Array.isArray(colData.fields) || Array.isArray(colData.files))) {
              sanitizeCollection(colData);
              config.collections.push(colData);
            }
          }

          // ৪. Sveltia CMS ইনিশিয়ালাইজ
          const cms = window.CMS || window.SveltiaCMS;
          if (cms && typeof cms.init === 'function') {
            cms.init({ config });
          } else {
            console.error('[CMS Loader] Sveltia CMS লোড হয়নি।');
          }

        } catch (e) {
          console.error('CMS Loader Error:', e);
        }
      });
    </script>
  </body>
</html>
