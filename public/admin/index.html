<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GulshanHotels Admin - Sveltia CMS</title>
    
    <!-- Prevent Auto Init before loading modular YML files -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <!-- JS-YAML & Sveltia CMS Scripts -->
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- AUTOMATICALLY FETCHES AND MERGES YOUR MODULAR YML FILES -->
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        try {
          // 1. Fetch main base config
          const mainRes = await fetch('/admin/config.yml');
          const mainText = await mainRes.text();
          const config = jsyaml.load(mainText) || {};

          // 2. Fetch 6 individual section YML files for Hotel Directory
          const hotelSectionFiles = [
            '/admin/collections/hotel/1-header.yml',
            '/admin/collections/hotel/2-about-rates.yml',
            '/admin/collections/hotel/3-amenities-rooms.yml',
            '/admin/collections/hotel/4-location-map.yml',
            '/admin/collections/hotel/5-reviews.yml',
            '/admin/collections/hotel/6-faqs.yml'
          ];

          let hotelFields = [];

          for (const fileUrl of hotelSectionFiles) {
            try {
              const res = await fetch(fileUrl);
              if (res.ok) {
                const text = await res.text();
                const fieldsArr = jsyaml.load(text);
                if (Array.isArray(fieldsArr)) {
                  hotelFields.push(...fieldsArr);
                }
              }
            } catch (err) {
              console.warn('Could not load hotel YML section file:', fileUrl, err);
            }
          }

          // 3. Homepage Settings Collection (Popular Hotels & Hero Controls)
          const homepageCollection = {
            name: "homepage",
            label: "🏠 Homepage Settings",
            files: [
              {
                name: "popular_hotels",
                label: "Popular Hotels Carousel Section",
                file: "src/content/homepage/popular-hotels.md",
                fields: [
                  {
                    label: "Show Popular Hotels Section on Homepage?",
                    name: "enable_popular_hotels",
                    widget: "boolean",
                    default: true
                  },
                  {
                    label: "Section Title",
                    name: "popular_hotels_title",
                    widget: "string",
                    default: "Popular Hotels in Gulshan, Dhaka"
                  },
                  {
                    label: "Section Subtitle",
                    name: "popular_hotels_subtitle",
                    widget: "text",
                    default: "Handpicked top luxury & executive stays recommended by verified guest reviews."
                  },
                  {
                    label: "Maximum Hotels to Show on Carousel",
                    name: "max_hotels",
                    widget: "number",
                    value_type: "int",
                    default: 10
                  }
                ]
              }
            ]
          };

          // 4. Guest Reviews & Subscribers Collections
          let reviewsCollection = null;
          try {
            const resRev = await fetch('/admin/collections/guest-reviews.yml');
            if (resRev.ok) {
              const textRev = await resRev.text();
              reviewsCollection = jsyaml.load(textRev);
            }
          } catch (err) {}

          const subscribersCollection = {
            name: "subscribers",
            label: "📧 Subscribers List",
            label_singular: "Subscriber",
            folder: "src/content/subscribers",
            create: false,
            slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
            summary: "{{email}} — (Subscribed: {{subscribed_at}})",
            fields: [
              { label: "Subscriber Email Address", name: "email", widget: "string" },
              { label: "Subscribed Date & Time", name: "subscribed_at", widget: "string" },
              { label: "Subscription Status", name: "status", widget: "string", default: "active" }
            ]
          };

          // 5. Build Hotel Collection
          const hotelCollection = {
            name: "hotels",
            label: "🏨 Hotels Directory",
            label_singular: "Hotel",
            folder: "src/content/hotels",
            create: true,
            slug: "{{slug}}",
            summary: "{{title}} - Link: /{{slug}}",
            fields: hotelFields
          };

          // 6. Push All Collections into Sveltia CMS
          config.collections = [];
          config.collections.push(hotelCollection);
          config.collections.push(homepageCollection); // Added Homepage Settings
          if (reviewsCollection) config.collections.push(reviewsCollection);
          config.collections.push(subscribersCollection);

          // 7. Initialize Sveltia CMS
          if (window.CMS && typeof window.CMS.init === 'function') {
            window.CMS.init({ config });
          } else if (window.SveltiaCMS && typeof window.SveltiaCMS.init === 'function') {
            window.SveltiaCMS.init({ config });
          }
        } catch (e) {
          console.error('Manual CMS Init Error:', e);
        }
      });
    </script>
  </body>
</html>
