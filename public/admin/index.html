<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GulshanHotels Admin - Sveltia CMS</title>
        <script>
      window.CMS_MANUAL_INIT = true;
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- UNIVERSAL SMART AUTO-LOADER (PERMANENT SOLUTION) -->
    <script>
      function sanitizeSveltiaFields(fields) {
        if (!Array.isArray(fields)) return;
        fields.forEach(f => {
          if (f && typeof f === 'object') {
            if (f.field && typeof f.field === 'object' && !f.field.name) {
              f.field.name = f.field.label 
                ? f.field.label.toLowerCase().replace(/[^a-z0-9]/g, '_') 
                : (f.name ? f.name + '_item' : 'item');
            }
            if (Array.isArray(f.fields)) sanitizeSveltiaFields(f.fields);
            if (f.field && Array.isArray(f.field.fields)) sanitizeSveltiaFields(f.field.fields);
          }
        });
      }

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          const mainRes = await fetch('/admin/config.yml');
          const mainText = await mainRes.text();
          const config = jsyaml.load(mainText) || {};
          config.collections = [];

          // ১. হোটেলের ৬টি খণ্ডাংশ স্বয়ংক্রিয়ভাবে জোড়া লাগানো
          const hotelSectionFiles = [
            '/admin/collections/hotel/1-header.yml',
            '/admin/collections/hotel/2-about-rates.yml',
            '/admin/collections/hotel/3-amenities-rooms.yml',
            '/admin/collections/hotel/4-location-map.yml',
            '/admin/collections/hotel/5-reviews.yml',
            '/admin/collections/hotel/6-faqs.yml'
          ];

          let hotelFields = [];
          for (const fileUrl of hotelSectionFiles) {
            try {
              const res = await fetch(fileUrl);
              if (res.ok) {
                const text = await res.text();
                const fieldsArr = jsyaml.load(text);
                if (Array.isArray(fieldsArr)) hotelFields.push(...fieldsArr);
              }
            } catch (e) {}
          }

          if (hotelFields.length > 0) {
            sanitizeSveltiaFields(hotelFields);
            config.collections.push({
              name: "hotels",
              label: "🏨 Hotels Directory",
              label_singular: "Hotel",
              folder: "src/content/hotels",
              create: true,
              slug: "{{slug}}",
              summary: "{{title}} - Link: /{{slug}}",
              fields: hotelFields
            });
          }

          // ২. পপুলার হোটেলস হোমপেজ সেটিংস
          try {
            const resPop = await fetch('/admin/collections/popular-hotels.yml');
            if (resPop.ok) {
              const textPop = await resPop.text();
              const popFields = jsyaml.load(textPop);
              if (Array.isArray(popFields)) {
                sanitizeSveltiaFields(popFields);
                config.collections.push({
                  name: "homepage",
                  label: "🏠 Homepage Settings",
                  files: [
                    {
                      name: "popular_hotels",
                      label: "Popular Hotels Carousel Section",
                      file: "src/content/homepage/popular-hotels.md",
                      fields: popFields
                    }
                  ]
                });
              }
            }
          } catch (e) {}

          // ৩. ইউনিভার্সাল অটো-স্ক্যানার (সবগুলো কালেকশন অটোমেটিক হ্যান্ডেল করবে)
          const allPossibleCollections = [
            'destinations.yml',
            'posts.yml',          // ব্লগ ও ট্রাভেল গাইড
            'pages.yml',          // সাধারণ পেজসমূহ (About, Terms, Privacy)
            'guest-reviews.yml',  // রিভিউ অ্যাপ্রুভাল
            'subscribers.yml'     // নিউজলেটার সাবস্ক্রাইবার্স
          ];

          for (const colFile of allPossibleCollections) {
            try {
              const res = await fetch(`/admin/collections/${colFile}`);
              if (res.ok) {
                const text = await res.text();
                const colData = jsyaml.load(text);
                if (colData && (Array.isArray(colData.fields) || Array.isArray(colData.files))) {
                  if (Array.isArray(colData.fields)) sanitizeSveltiaFields(colData.fields);
                  config.collections.push(colData);
                }
              }
            } catch (e) {
              // ফাইল না থাকলে বা ভুল হলে চুপচাপ স্কিপ করবে, পুরো সাইট ক্র্যাশ করবে না
            }
          }

          // ৪. Sveltia CMS ইনিশিয়ালাইজ
          if (window.CMS && typeof window.CMS.init === 'function') {
            window.CMS.init({ config });
          } else if (window.SveltiaCMS && typeof window.SveltiaCMS.init === 'function') {
            window.SveltiaCMS.init({ config });
          }

        } catch (e) {
          console.error('CMS Loader Error:', e);
        }
      });
    </script>
  </body>
</html>
