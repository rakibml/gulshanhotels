<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GulshanHotels Admin - Sveltia CMS</title>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>

    <!-- ADMIN PANEL CUSTOM STYLING & LEFT SIDEBAR NAVIGATION -->
    <style>
      /* ১. সেকশন হেডার ব্যানার স্টাইল */
      .sveltia-section-banner {
        background: linear-gradient(135deg, #064e3b 0%, #022c22 100%) !important;
        border: 1px solid #10b981 !important;
        border-left: 6px solid #34d399 !important;
        border-radius: 12px !important;
        padding: 16px 20px !important;
        margin: 36px 0 16px 0 !important;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45) !important;
        width: 100% !important;
        box-sizing: border-box !important;
        scroll-margin-top: 80px !important; /* হেডার যেন ব্যানারের ওপর না উঠে */
        transition: all 0.3s ease !important;
      }
      .sveltia-section-title {
        font-size: 15px !important;
        font-weight: 800 !important;
        color: #ffffff !important;
        letter-spacing: 0.6px !important;
        text-transform: uppercase !important;
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
      }
      .sveltia-section-desc {
        font-size: 12px !important;
        color: #a7f3d0 !important;
        margin-top: 6px !important;
        line-height: 1.4 !important;
        font-weight: 400 !important;
      }

      /* সেকশন জাম্প করার সময় পালস গ্লো ইফেক্ট */
      @keyframes sectionPulse {
        0% { box-shadow: 0 0 0px #10b981; transform: scale(1); }
        50% { box-shadow: 0 0 25px #10b981; transform: scale(1.015); border-color: #34d399; }
        100% { box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45); transform: scale(1); }
      }
      .section-targeted {
        animation: sectionPulse 0.8s ease-in-out !important;
      }

      [data-field-type="instructions"] label {
        display: none !important;
      }

      /* ২. বামপাশের ফ্লোটিং কুইক নেভিগেশন বার (ছবিতে লাল দাগ দেওয়া জায়গা) */
      #cms-quick-nav {
        position: fixed;
        top: 75px;
        left: 20px;
        width: 220px;
        background: rgba(15, 23, 42, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        padding: 14px 10px;
        z-index: 99999;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
        display: none; /* ডিফল্ট হাইড, এডিট পেজে এলে JS শো করাবে */
        animation: fadeInNav 0.25s ease-out;
      }

      @keyframes fadeInNav {
        from { opacity: 0; transform: translateX(-15px); }
        to { opacity: 1; transform: translateX(0); }
      }

      .quick-nav-header {
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        color: #34d399;
        letter-spacing: 0.8px;
        padding: 0 8px 10px 8px;
        border-b: 1px solid rgba(255, 255, 255, 0.08);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .quick-nav-btn {
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        color: #cbd5e1;
        font-size: 12.5px;
        font-weight: 600;
        padding: 8px 10px;
        margin-bottom: 4px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s ease;
      }

      .quick-nav-btn:hover {
        background: rgba(16, 185, 129, 0.15);
        color: #ffffff;
        transform: translateX(4px);
      }

      .quick-nav-btn:active {
        transform: scale(0.97);
      }

      /* স্ক্রিন ছোট হলে বা মোবাইলে ফর্ম না ঢেকে স্বয়ংক্রিয়ভাবে হাইড হবে */
      @media (max-width: 1200px) {
        #cms-quick-nav {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- Floating Left Navigation Bar Container -->
    <div id="cms-quick-nav">
      <div class="quick-nav-header">
        <span>⚡ Quick Sections</span>
        <span style="font-size: 9px; opacity: 0.7;">Jump to</span>
      </div>
      <div id="quick-nav-links"></div>
    </div>

    <script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

    <!-- UNIVERSAL SMART AUTO-LOADER & SIDEBAR NAV SCRIPT -->
    <script>
      // ১. কাস্টম instructions ব্যানার উইজেট রেজিস্টার (Sveltia CMS)
      function registerInstructionWidget() {
        const cms = window.CMS || window.SveltiaCMS;
        if (!cms || typeof cms.registerWidget !== 'function') return;

        cms.registerWidget(
          'instructions',
          window.createClass({
            render() {
              const field = this.props.field;
              const label = (field && typeof field.get === 'function' ? field.get('label') : field?.label) || 'Section';
              const desc = (field && typeof field.get === 'function' ? (field.get('description') || field.get('hint')) : (field?.description || field?.hint)) || '';

              return window.h('div', { className: 'sveltia-section-banner' },
                window.h('div', { className: 'sveltia-section-title' }, label),
                desc ? window.h('div', { className: 'sveltia-section-desc' }, desc) : null
              );
            }
          })
        );
      }

      // ২. হেল্পার ফাংশনসমূহ
      function sanitizeSveltiaFields(fields) {
        if (!Array.isArray(fields)) return;
        fields.forEach(f => {
          if (f && typeof f === 'object') {
            if (f.field && typeof f.field === 'object' && !f.field.name) {
              f.field.name = f.field.label
                ? f.field.label.toLowerCase().replace(/[^a-z0-9]/g, '_')
                : (f.name ? f.name + '_item' : 'item');
            }
            if (Array.isArray(f.fields)) sanitizeSveltiaFields(f.fields);
            if (f.field && Array.isArray(f.field.fields)) sanitizeSveltiaFields(f.field.fields);
            if (Array.isArray(f.types)) sanitizeSveltiaFields(f.types);
          }
        });
      }

      function sanitizeCollection(col) {
        if (!col || typeof col !== 'object') return;
        if (Array.isArray(col.fields)) sanitizeSveltiaFields(col.fields);
        if (Array.isArray(col.files)) {
          col.files.forEach(file => {
            if (file && Array.isArray(file.fields)) sanitizeSveltiaFields(file.fields);
          });
        }
      }

      async function loadYaml(url) {
        try {
          const res = await fetch(url);
          if (!res.ok) {
            console.warn('[CMS Loader] ফাইল পাওয়া যায়নি (' + res.status + '):', url);
            return null;
          }
          const text = await res.text();
          return jsyaml.load(text);
        } catch (e) {
          console.warn('[CMS Loader] ফাইল পড়তে সমস্যা:', url, e);
          return null;
        }
      }

      // ৩. ফ্লোটিং নেভবার অটোমেটিক কন্ট্রোল (DOM Watcher)
      function setupFloatingNavObserver() {
        const navContainer = document.getElementById('cms-quick-nav');
        const linksContainer = document.getElementById('quick-nav-links');

        const observer = new MutationObserver(() => {
          const banners = document.querySelectorAll('.sveltia-section-banner');

          // এডিট পেজে ব্যানার পাওয়া গেলে মেনু তৈরি করো
          if (banners.length > 0) {
            navContainer.style.display = 'block';

            // যদি ইতিমধ্যে বাটন তৈরি হয়ে থাকে তবে বারবার বানাবে না
            if (linksContainer.children.length === banners.length) return;

            linksContainer.innerHTML = '';

            banners.forEach((banner, index) => {
              // ইউনিক আইডি বসাও
              if (!banner.id) {
                banner.id = 'sec-anchor-' + (index + 1);
              }

              const titleEl = banner.querySelector('.sveltia-section-title');
              let rawTitle = titleEl ? titleEl.textContent.trim() : ('Section ' + (index + 1));
              
              // ছোট টাইটেল বানানো
              const shortTitle = rawTitle.replace(/\d+\.\s*/, '').slice(0, 18);

              const btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'quick-nav-btn';
              btn.innerHTML = `<span>${index + 1}.</span> <span>${shortTitle}</span>`;

              btn.onclick = (e) => {
                e.preventDefault();
                banner.scrollIntoView({ behavior: 'smooth', block: 'start' });

                // টার্গেট সেকশনে গ্লো অ্যানিমেশন দেওয়া
                banner.classList.remove('section-targeted');
                void banner.offsetWidth; // trigger reflow
                banner.classList.add('section-targeted');
              };

              linksContainer.appendChild(btn);
            });
          } else {
            // লিস্ট পেজে বা লগইনে থাকলে নেভবার হাইড রাখো
            navContainer.style.display = 'none';
            linksContainer.innerHTML = '';
          }
        });

        observer.observe(document.body, { childList: true, subtree: true });
      }

      document.addEventListener('DOMContentLoaded', async () => {
        try {
          registerInstructionWidget();
          setupFloatingNavObserver();

          // ০. মূল config.yml
          const mainRes = await fetch('/admin/config.yml');
          if (!mainRes.ok) {
            throw new Error('/admin/config.yml পাওয়া যায়নি (status ' + mainRes.status + ')');
          }
          const mainText = await mainRes.text();
          const config = jsyaml.load(mainText) || {};
          config.collections = [];

          // ১. হোটেলের ৬টি সেকশনের সংজ্ঞা
          const hotelSections = [
            {
              url: '/admin/collections/hotel/1-header.yml',
              title: '🏨 1. HERO & HEADER SECTION',
              desc: 'Hotel Title, Location Address, Tagline, Cover Image & Photo Gallery'
            },
            {
              url: '/admin/collections/hotel/2-about-rates.yml',
              title: '🏷️ 2. ABOUT HOTEL & LIVE RATES',
              desc: 'Overview Description, Starting Price, Live Booking Channels & WhatsApp/Phone'
            },
            {
              url: '/admin/collections/hotel/3-amenities-rooms.yml',
              title: '🛏️ 3. AMENITIES & ROOM TYPES',
              desc: 'Hotel Amenities, Featured Highlights, Room Categories & Capacities'
            },
            {
              url: '/admin/collections/hotel/4-location-map.yml',
              title: '📍 4. LOCATION & SURROUNDINGS',
              desc: 'Google Maps Embed, Nearby Attractions, Airport Distances & Transportation'
            },
            {
              url: '/admin/collections/hotel/5-reviews.yml',
              title: '⭐ 5. GUEST REVIEWS & RATINGS',
              desc: 'Overall Review Score, Cleanliness/Location Breakdown & Verified Reviews'
            },
            {
              url: '/admin/collections/hotel/6-faqs.yml',
              title: '📋 6. POLICIES & FAQS',
              desc: 'Check-in/out Rules, Extra Bed Policies, Accepted Payments & FAQs'
            }
          ];

          const hotelFields = [];

          for (let i = 0; i < hotelSections.length; i++) {
            const sec = hotelSections[i];
            const fieldsArr = await loadYaml(sec.url);

            if (Array.isArray(fieldsArr) && fieldsArr.length > 0) {
              const firstField = fieldsArr[0];
              const alreadyHasBanner = firstField && (firstField.widget === 'instructions' || (firstField.name && firstField.name.includes('notice')));

              if (!alreadyHasBanner) {
                hotelFields.push({
                  label: sec.title,
                  name: `sec_banner_${i + 1}`,
                  widget: "instructions",
                  description: sec.desc,
                  required: false
                });
              }

              hotelFields.push(...fieldsArr);
            }
          }

          if (hotelFields.length > 0) {
            sanitizeSveltiaFields(hotelFields);
            config.collections.push({
              name: "hotels",
              label: "🏨 Hotels Directory",
              label_singular: "Hotel",
              folder: "src/content/hotels",
              create: true,
              slug: "{{slug}}",
              summary: "{{title}} - Link: /{{slug}}",
              fields: hotelFields
            });
          }

          // ২. হোমপেজ সেটিংস
          const popFields = await loadYaml('/admin/collections/popular-hotels.yml');
          if (Array.isArray(popFields)) {
            sanitizeSveltiaFields(popFields);
            config.collections.push({
              name: "homepage",
              label: "🏠 Homepage Settings",
              files: [
                {
                  name: "popular_hotels",
                  label: "Popular Hotels Carousel Section",
                  file: "src/content/homepage/popular-hotels.md",
                  fields: popFields
                }
              ]
            });
          }

          // ৩. বাকি সব collection অটো-স্ক্যান
          const allPossibleCollections = [
            'destinations.yml',
            'posts.yml',
            'pages.yml',
            'guest-reviews.yml',
            'subscribers.yml'
          ];

          for (const colFile of allPossibleCollections) {
            let colData = await loadYaml('/admin/collections/' + colFile);
            if (!colData) continue;
            if (Array.isArray(colData)) colData = colData[0];

            if (colData && (Array.isArray(colData.fields) || Array.isArray(colData.files))) {
              sanitizeCollection(colData);
              config.collections.push(colData);
            }
          }

          // ৪. Sveltia CMS চালু
          const cms = window.CMS || window.SveltiaCMS;
          if (cms && typeof cms.init === 'function') {
            cms.init({ config });
          } else {
            console.error('[CMS Loader] Sveltia CMS লোড হয়নি।');
          }

        } catch (e) {
          console.error('CMS Loader Error:', e);
        }
      });
    </script>
  </body>
</html>
