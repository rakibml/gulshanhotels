name: "posts"
label: "📝 Travel Guides & Posts"
label_singular: "Post"
folder: "src/content/posts"
create: true
slug: "{{slug}}"
summary: "{{title}} — {{category}} ({{date}})"
sortable_fields: ["date", "title"]

view_filters:
  - label: "Travel Guides"
    field: "category"
    pattern: "Travel Guide"
  - label: "Embassy Guides"
    field: "category"
    pattern: "Embassy Guide"
  - label: "Food & Dining"
    field: "category"
    pattern: "Food & Dining"

fields:
  - label: "Post Title (মূল শিরোনাম)"
    name: "title"
    widget: "string"

  - label: "URL Slug (e.g. 5-star-hotels-in-gulshan)"
    name: "slug"
    widget: "string"

  - label: "Short Description / Excerpt"
    name: "description"
    widget: "text"

  - label: "Publish Date"
    name: "date"
    widget: "datetime"
    date_format: "MMM DD, YYYY"
    time_format: false

  - label: "Category"
    name: "category"
    widget: "select"
    options:
      - "Travel Guide"
      - "Embassy Guide"
      - "Hotel Review"
      - "Food & Dining"
      - "Diplomatic Living"
    default: "Travel Guide"

  - label: "Estimated Read Time"
    name: "readTime"
    widget: "string"
    default: "4 min read"

  - label: "Author Name"
    name: "author"
    widget: "string"
    default: "Local Concierge Team"

  - label: "Featured Cover Image"
    name: "image"
    widget: "image"

  # 🎯 হোটেল এম্বেড অপশন (ড্রপডাউন দিয়ে সিলেক্ট করার জন্য)
  - label: "🏨 Recommended Hotels in this Guide (Live Booking Cards)"
    name: "recommended_hotels"
    widget: "list"
    required: false
    hint: "আর্টিকেলের শেষে লাইভ বুকিং কার্ড হিসেবে যে যে হোটেল দেখাতে চান সেগুলো ড্রপডাউন থেকে সিলেক্ট করুন।"
    field:
      label: "Select Hotel"
      name: "hotel_slug"
      widget: "relation"
      collection: "hotels"
      search_fields: ["title"]
      value_field: "{{slug}}"
      display_fields: ["title"]

  - label: "📌 Key Takeaways"
    name: "takeaways"
    widget: "list"
    required: false
    field: { label: "Point", name: "point", widget: "string" }

  - label: "Article Content (মূল লেখার বডি)"
    name: "body"
    widget: "markdown"
