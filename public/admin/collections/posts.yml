name: "posts"
label: "📝 Travel Guides & Posts"
label_singular: "Post"
folder: "src/content/posts"
create: true
slug: "{{slug}}"
summary: "{{title}} — {{category}} ({{date}})"
sortable_fields: ["date", "title"]

view_filters:
  - label: "Travel Guides"
    field: "category"
    pattern: "Travel Guide"
  - label: "Embassy Guides"
    field: "category"
    pattern: "Embassy Guide"
  - label: "Food & Dining"
    field: "category"
    pattern: "Food & Dining"

fields:
  - { label: "Post Title", name: "title", widget: "string" }
  - { label: "URL Slug (e.g. 5-star-hotels-in-gulshan)", name: "slug", widget: "string", hint: "ছোট হাতের অক্ষর ও হাইফেন ব্যবহার করবেন।" }
  - { label: "Short Description / Excerpt (গুগল এসইওর জন্য)", name: "description", widget: "text" }
  - { label: "Publish Date", name: "date", widget: "date", format: "MMM DD, YYYY", default: "" }
  - label: "Category"
    name: "category"
    widget: "select"
    options:
      - "Travel Guide"
      - "Embassy Guide"
      - "Hotel Review"
      - "Food & Dining"
      - "Diplomatic Living"
    default: "Travel Guide"
  - { label: "Read Time (e.g. 4 min read)", name: "readTime", widget: "string", default: "4 min read" }
  - { label: "Author Name", name: "author", widget: "string", default: "Local Concierge Team" }
  - { label: "Featured Image (বড় কাভার ফটো)", name: "image", widget: "image" }
  - { label: "Article Content (মূল লেখা)", name: "body", widget: "markdown" }
