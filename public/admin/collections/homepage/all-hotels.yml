- label: "ALL HOTELS DIRECTORY SECTION"
  name: "all_hotels_notice"
  widget: "instructions"
  description: "Controls section title, subtitle, and layout for the full hotels directory on the homepage."
  required: false

- label: "Section Title"
  name: "all_hotels_title"
  widget: "string"
  default: "All Hotels in Gulshan, Dhaka"

- label: "Section Subtitle"
  name: "all_hotels_subtitle"
  widget: "string"
  default: "Browse and filter all verified hotels by location, area, and landmarks."

- label: "Show All Hotels Directory Section on Homepage?"
  name: "enable_all_hotels"
  widget: "boolean"
  default: true
