name: "destinations"
label: "Destinations (Area Guides)"
label_singular: "Destination Page"
folder: "src/content/destinations" # আপনার প্রজেক্টের কন্টেন্ট ফোল্ডার পাথ
create: true
slug: "{{slug}}"
format: "yaml-frontmatter"
editor:
  preview: false

fields:
  - label: "Page Title"
    name: "title"
    widget: "string"
    hint: "যেমন: Hotels in Gulshan 1 অথবা Hotels in Gulshan 2"

  - label: "Location Subtitle"
    name: "location_subtitle"
    widget: "string"
    default: "Dhaka, Bangladesh"
    hint: "হিরো ব্যানারে ম্যাপ পিনের পাশে যা দেখাবে"

  - label: "Auto-Filter Keyword"
    name: "filter_keyword"
    widget: "string"
    hint: "যেমন: gulshan 1 অথবা gulshan 2। এই কি-ওয়ার্ড দিয়ে আপনার হোটেলের লোকেশন অটোমেটিক ফিল্টার হবে।"

  - label: "Hero Banner Image"
    name: "hero_image"
    widget: "image"
    choose_url: true
    hint: "হিরো সেকশনের বড় ব্যাকগ্রাউন্ড ছবি"

  - label: "SEO / Short Description"
    name: "description"
    widget: "text"
    hint: "হিরো ব্যানারে টাইটেলের নিচে এবং গুগল সার্চে দেখানোর ডেসক্রিপশন"

  - label: "Manually Select Hotels (Optional)"
    name: "selected_hotels"
    widget: "relation"
    collection: "hotels"
    search_fields: ["title", "location"]
    value_field: "{{slug}}"
    display_fields: ["title"]
    multiple: true
    required: false
    hint: "যদি নির্দিষ্ট কিছু হোটেল বাছতে চান তবে এখান থেকে সিলেক্ট করুন। ফাঁকা রাখলে কি-ওয়ার্ড দিয়ে অটোমেটিক আসবে।"

  - label: "About Section Image (Why Stay...)"
    name: "about_image"
    widget: "image"
    choose_url: true
    required: false
    hint: "'Why Stay in...' সেকশনের বাঁ পাশের ছবি"

  - label: "About Section Text"
    name: "about_text"
    widget: "text"
    required: false
    hint: "'Why Stay in...' সেকশনের ডেসক্রিপশন প্যারাগ্রাফ"

  - label: "Detailed Article Body"
    name: "body"
    widget: "markdown"
    required: false
    hint: "যদি পেজের নিচে এসইও-র জন্য আরও বড় কোনো আর্টিকেল বা কনটেন্ট লিখতে চান"
