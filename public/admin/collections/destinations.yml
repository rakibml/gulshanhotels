name: "destinations"
label: "📍 Locations & Categories (SEO Pages)"
label_singular: "Destination Page"
folder: "src/content/destinations"
create: true
slug: "{{slug}}"
summary: "{{title}} — /{{slug}}"
sortable_fields: ["title"]

fields:
  - label: "Page Title (যেমন: Hotels in Gulshan 1)"
    name: "title"
    widget: "string"

  - label: "H1 Main Heading (যেমন: Best Hotels in Gulshan 1 for Business & Transit)"
    name: "heading"
    widget: "string"

  - label: "URL Slug (যেমন: hotels-in-gulshan-1, hotels-near-us-embassy)"
    name: "slug"
    widget: "string"
    hint: "ফুটারের লিংকের সাথে মিলিয়ে ছোট হাতের অক্ষরে লিখবেন (যেমন: hotels-in-gulshan-1)।"

  - label: "Hero Badge (যেমন: Diplomatic Zone Guide, 5-Star Luxury)"
    name: "badge"
    widget: "string"
    default: "Area Stays Guide"

  - label: "SEO Meta Description"
    name: "description"
    widget: "text"

  - label: "Hero Cover Photo"
    name: "hero_image"
    widget: "image"

  # কোন কোন হোটেল শো করবে (স্বয়ংক্রিয় বা নির্দিষ্ট)
  - label: "Target Filter Keyword (ঐচ্ছিক)"
    name: "filter_keyword"
    widget: "string"
    hint: "হোটেল ফিল্টার করার শব্দ (যেমন: Gulshan 1, 5-Star, Embassy)। ফাঁকা রাখলে স্লাগ অনুযায়ী ফিল্টার করবে।"

  # লোকাল এরিয়া টিপস (Agoda/Booking কে হারানোর অস্ত্র)
  - label: "🗺️ Local Area Insights & Tips (ঐচ্ছিক)"
    name: "area_tips"
    widget: "list"
    required: false
    summary: "{{fields.title}}"
    fields:
      - { label: "Tip Title (যেমন: US Embassy Distance)", name: "title", widget: "string" }
      - { label: "Description (যেমন: Only 5-min walk via Madani Avenue. Morning traffic is minimal.)", name: "desc", widget: "text" }

  # প্রশ্নোত্তর
  - label: "❓ FAQs for this Area / Category (গুগল রিচ রেজাল্ট)"
    name: "faqs"
    widget: "list"
    required: false
    summary: "{{fields.question}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
