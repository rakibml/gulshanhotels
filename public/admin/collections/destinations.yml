name: "destinations"
label: "📍 Destinations (Area Guides)"
label_singular: "Destination Page"
folder: "src/content/destinations"
create: true
extension: "md"
format: "yaml-frontmatter"
slug: "{{fields.slug}}"
summary: "{{title}} — /{{slug}}"
sortable_fields: ["title"]
editor:
  preview: false

fields:
  # ================= PAGE BASICS =================
  - label: "Page Title (H1)"
    name: "title"
    widget: "string"
    hint: "যেমন: Hotels in Gulshan 2। পেজের মূল শিরোনাম ও ব্যানারে এটাই দেখাবে।"

  - label: "URL Slug"
    name: "slug"
    widget: "string"
    pattern: ['^(?!(about|contact|privacy|disclaimer|admin|sitemap)$)[a-z0-9]+(?:-[a-z0-9]+)*$', 'শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা ও হাইফেন দিন। about, contact, privacy, disclaimer, admin, sitemap দেওয়া যাবে না।']
    hint: "যেমন: hotels-in-gulshan-2। কোনো হোটেলের slug এর সাথে হুবহু মিলানো যাবে না।"

  - label: "Location Subtitle"
    name: "location_subtitle"
    widget: "string"
    required: false
    hint: "ব্যানারে শিরোনামের নিচে ছোট লেখা। যেমন: Gulshan 2, Dhaka"

  - label: "Hero Banner Image"
    name: "hero_image"
    widget: "image"
    choose_url: true
    required: false
    hint: "ব্যানার কভার ছবি আপলোড করুন।"

  # ================= SEO =================
  - label: "SEO Title (Optional)"
    name: "seo_title"
    widget: "string"
    required: false
    pattern: ['^.{10,65}$', '১০ থেকে ৬৫ অক্ষরের মধ্যে লিখুন']
    hint: "গুগলে নীল শিরোনাম হিসেবে দেখায়। ফাঁকা রাখলে পেজের টাইটেল থেকে অটো তৈরি হবে।"

  - label: "Description (Meta Description + Page Intro)"
    name: "description"
    widget: "text"
    pattern: ['^.{50,170}$', '৫০ থেকে ১৭০ অক্ষরের মধ্যে লিখুন']
    hint: "গুগল সার্চ ও পেজ ইন্ট্রো হিসেবে দেখায়। ১২০ থেকে ১৬০ অক্ষর আদর্শ।"

  # ================= LONG ARTICLE BODY =================
  - label: "Detailed Article Body"
    name: "body"
    widget: "markdown"
    required: false
    hint: "পেজের মূল আর্টিকেল (এলাকা সম্পর্কে তথ্য, এলাকা গাইড ইত্যাদি)। এটি গুগলের জন্য অত্যন্ত গুরুত্বপূর্ণ।"

  # ================= COMPARISON TABLE CONTROLS =================
  - label: "Show Hotel Comparison Table?"
    name: "enable_comparison_table"
    widget: "boolean"
    default: true
    required: false
    hint: "গুগল টেবিল স্নিপেটের জন্য স্বয়ংক্রিয় তুলনা টেবিল দেখাতে চান কি না।"

  - label: "Comparison Table Title"
    name: "comparison_title"
    widget: "string"
    required: false
    hint: "ফাঁকা রাখলে 'Quick Comparison of Hotels in...' স্বয়ংক্রিয়ভাবে তৈরি হবে।"

  # ================= HOTEL LIST CONTROLS =================
  - label: "Auto-Filter Keyword"
    name: "filter_keyword"
    widget: "string"
    required: false
    hint: "যেমন: gulshan 2। হোটেলের location, category বা নামে এই শব্দ থাকলে পেজে আসবে।"

  - label: "Manually Select Hotels (Optional)"
    name: "selected_hotels"
    widget: "relation"
    collection: "hotels"
    search_fields: ["title", "location"]
    value_field: "{{slug}}"
    display_fields: ["title"]
    multiple: true
    required: false
    hint: "হাতে কলমে নির্দিষ্ট কিছু হোটেল বেছে দিতে চাইলে এখানে সিলেক্ট করুন।"

  - label: "Hotels Section Tag"
    name: "hotels_tag"
    widget: "string"
    required: false
    hint: "হোটেল তালিকার ওপরে ছোট লেখা (যেমন: STAYS IN GULSHAN 2)।"

  - label: "Hotels Section Title (H2)"
    name: "hotels_title"
    widget: "string"
    required: false
    hint: "ফাঁকা রাখলে 'Accommodations in Gulshan 2' অটো তৈরি হবে।"

  # ================= FAQ =================
  - label: "FAQs"
    name: "faqs"
    widget: "list"
    required: false
    summary: "{{fields.question}}"
    hint: "প্রশ্ন ও উত্তর উভয়ই দিলে তা পেজে এবং গুগল FAQ Schema-তে যুক্ত হবে।"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
