collections:
  # ১. ল্যান্ডিং পেজ কালেকশন (ছবিটির মতো নতুন পেজ বানানোর জন্য)
  - name: "landing_pages"
    label: "Area Landing Pages"
    folder: "src/content/landing"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Page Title", name: "title", widget: "string", hint: "যেমন: Hotels in Gulshan 1" }
      - { label: "Location Subtitle", name: "location_subtitle", widget: "string", default: "Dhaka, Bangladesh" }
      - { label: "Filter Keyword", name: "filter_keyword", widget: "string", hint: "যেমন: gulshan 1 (এই এলাকার হোটেলগুলো অটো আসবে)" }
      - { label: "Hero Image", name: "hero_image", widget: "image" }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "About Section Image", name: "about_image", widget: "image" }
      - { label: "About Section Text", name: "about_text", widget: "text" }
      - { label: "Full Article Body", name: "body", widget: "markdown", required: false }

  # ২. হোটেল কালেকশন (কার্ডের রেটিং, স্টার, টাকার দাম দেখানোর জন্য)
  - name: "hotels"
    label: "Hotels Directory"
    folder: "src/content/hotels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Hotel Name", name: "title", widget: "string" }
      - { label: "Location", name: "location", widget: "string", hint: "যেমন: Gulshan 1, Dhaka" }
      - { label: "Price per night (BDT)", name: "price", widget: "string", hint: "যেমন: 16,000" }
      - { label: "Stars", name: "stars", widget: "number", default: 5 }
      - { label: "Rating", name: "rating", widget: "string", default: "4.8" }
      - { label: "Reviews Count", name: "reviews_count", widget: "string", default: "1,250" }
      - { label: "Hotel Image", name: "image", widget: "image" }
      - { label: "Amenities", name: "amenities", widget: "list", default: ["Pool", "Gym", "Restaurant", "Free WiFi"] }
