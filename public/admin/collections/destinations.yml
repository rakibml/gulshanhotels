name: "destinations"
label: "📍 Destinations (Area Guides)"
label_singular: "Destination Page"
folder: "src/content/destinations"
create: true
extension: "md"
format: "yaml-frontmatter"
slug: "{{fields.slug}}"
summary: "{{title}} — /{{slug}}"
sortable_fields: ["title"]
editor:
  preview: false

fields:
  - label: "Page Title (H1)"
    name: "title"
    widget: "string"
    hint: "যেমন: Hotels in Gulshan 1"

  - label: "URL Slug"
    name: "slug"
    widget: "string"
    pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'শুধুমাত্র ছোট হাতের ইংরেজি অক্ষর ও হাইফেন দিন (যেমন: hotels-in-gulshan-1)']
    hint: "যেমন: hotels-in-gulshan-1"

  - label: "Location Subtitle"
    name: "location_subtitle"
    widget: "string"
    required: false
    hint: "ম্যাপ পিনের পাশে যা দেখাবে (যেমন: Gulshan, Dhaka)"

  - label: "Hero Badge (Optional)"
    name: "hero_badge"
    widget: "string"
    required: false
    hint: "যেমন: Direct Local Rates বা Diplomatic Zone Stays"

  - label: "Hero Banner Image"
    name: "hero_image"
    widget: "image"
    choose_url: true
    required: false

  - label: "SEO / Meta Description"
    name: "description"
    widget: "text"
    hint: "হিরো ব্যানারের বিবরণ ও গুগল সার্চের মেটা ডেসক্রিপশন"

  - label: "Auto-Filter Keyword"
    name: "filter_keyword"
    widget: "string"
    required: false
    hint: "যেমন: gulshan 1 বা 5-star। ফাঁকা রাখলে স্লাগ থেকে অটো খুঁজবে।"

  - label: "Manually Select Hotels (Optional)"
    name: "selected_hotels"
    widget: "relation"
    collection: "hotels"
    search_fields: ["title", "location"]
    value_field: "{{slug}}"
    display_fields: ["title"]
    multiple: true
    required: false

  # ================= HOTELS SECTION CONTROLS =================
  - label: "Hotels Section Tag"
    name: "hotels_tag"
    widget: "string"
    required: false
    hint: "যেমন: CURATED ACCOMMODATIONS"

  - label: "Hotels Section Title (H2)"
    name: "hotels_title"
    widget: "string"
    required: false
    hint: "ফাঁকা রাখলে পেজের টাইটেল অনুযায়ী অটো তৈরি হবে"

  - label: "All Hotels Link Text"
    name: "all_hotels_link_text"
    widget: "string"
    required: false
    hint: "যেমন: Browse All Hotels"

  - label: "All Hotels Link URL"
    name: "all_hotels_link_url"
    widget: "string"
    required: false
    hint: "যেমন: /hotels অথবা /#hotels"

  # ================= ABOUT / WHY STAY SECTION =================
  - label: "About Section Tag"
    name: "about_tag"
    widget: "string"
    required: false
    hint: "যেমন: AREA OVERVIEW"

  - label: "About Section Heading (H2)"
    name: "about_title"
    widget: "string"
    required: false
    hint: "যেমন: Why Stay in Gulshan 1?"

  - label: "About Section Image"
    name: "about_image"
    widget: "image"
    choose_url: true
    required: false

  - label: "About Section Text"
    name: "about_text"
    widget: "text"
    required: false

  - label: "Area Highlights"
    name: "area_highlights"
    widget: "list"
    required: false
    summary: "{{fields.title}}"
    fields:
      - { label: "Highlight Title (H3)", name: "title", widget: "string" }
      - { label: "Short Description", name: "desc", widget: "string", required: false }

  # ================= FAQ SECTION CONTROLS =================
  - label: "FAQ Badge Text"
    name: "faq_badge"
    widget: "string"
    required: false
    hint: "যেমন: Verified Traveler FAQs"

  - label: "FAQ Section Title (H2)"
    name: "faq_title"
    widget: "string"
    required: false
    hint: "যেমন: Frequently Asked Questions"

  - label: "FAQ Subtitle / Description"
    name: "faq_description"
    widget: "text"
    required: false
    hint: "প্রশ্নের উপরে ছোট বিবরণ (ঐচ্ছিক)"

  - label: "FAQs"
    name: "faqs"
    widget: "list"
    required: false
    summary: "{{fields.question}}"
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }

  # ================= LONG ARTICLE BODY =================
  - label: "Detailed Article Body"
    name: "body"
    widget: "markdown"
    required: false
