- name: "destinations"
  label: "📍 Locations & Categories (SEO Pages)"
  label_singular: "Destination Page"
  folder: "src/content/destinations"
  create: true
  slug: "{{fields.slug}}"
  summary: "{{title}} — /{{slug}}"
  sortable_fields: ["title"]

  fields:
    - label: "URL Slug (যেমন: hotels-in-gulshan-1, hotels-near-us-embassy)"
      name: "slug"
      widget: "string"
      pattern: ["^[a-z0-9-]+$", "শুধু ছোট হাতের ইংরেজি অক্ষর, সংখ্যা আর - ব্যবহার করুন"]
      hint: "এই নামেই ফাইল তৈরি হবে। সেভ করার পর বদলাবেন না।"

    - label: "Page Title (যেমন: Hotels in Gulshan 1)"
      name: "title"
      widget: "string"

    - label: "H1 Main Heading (যেমন: Best Hotels in Gulshan 1 for Business & Transit)"
      name: "heading"
      widget: "string"

    - label: "SEO Title (ঐচ্ছিক)"
      name: "seo_title"
      widget: "string"
      required: false
      hint: "ফাঁকা রাখলে 'Page Title | GulshanHotels.com' হবে।"

    - label: "Hero Badge (যেমন: Diplomatic Zone Guide, 5-Star Luxury)"
      name: "badge"
      widget: "string"
      required: false
      default: "Dhaka, Bangladesh"

    - label: "SEO Meta Description"
      name: "description"
      widget: "text"

    - label: "Hero Cover Photo"
      name: "hero_image"
      widget: "image"
      required: false

    # ---------- কোন হোটেল দেখাবে ----------
    - label: "Hotel Tag (ঐচ্ছিক)"
      name: "filter_tag"
      widget: "string"
      required: false
      hint: "যে hotel এর tags এ এই লেখা আছে, শুধু সেগুলো আসবে (যেমন: gulshan-1, us-embassy, ivac)। ফাঁকা রাখলে page এর slug ধরবে।"

    - label: "Hand-picked Hotels (ঐচ্ছিক)"
      name: "selected_hotels"
      widget: "relation"
      collection: "hotels"
      search_fields: ["title"]
      value_field: "{{slug}}"
      display_fields: ["title"]
      multiple: true
      required: false
      hint: "এখানে hotel বাছলে Hotel Tag এর বদলে শুধু এগুলোই দেখাবে।"

    # ---------- About section ----------
    - label: "About Title (যেমন: Why Stay in Gulshan 1?)"
      name: "about_title"
      widget: "string"
      required: false

    - label: "About Text"
      name: "about_text"
      widget: "text"
      required: false
      hint: "ফাঁকা রাখলে পুরো About section লুকিয়ে যাবে।"

    - label: "About Photo"
      name: "about_image"
      widget: "image"
      required: false

    - label: "Feature Points (যেমন: Prime Location)"
      name: "features"
      widget: "list"
      required: false
      summary: "{{fields.title}}"
      fields:
        - { label: "Title", name: "title", widget: "string" }
        - { label: "Short Text", name: "text", widget: "string" }

    # ---------- লোকাল টিপস ----------
    - label: "🗺️ Local Area Insights & Tips (ঐচ্ছিক)"
      name: "area_tips"
      widget: "list"
      required: false
      summary: "{{fields.title}}"
      fields:
        - { label: "Tip Title (যেমন: US Embassy Distance)", name: "title", widget: "string" }
        - { label: "Description", name: "desc", widget: "text" }

    # ---------- FAQ ----------
    - label: "❓ FAQs for this Area / Category (Google Rich Result)"
      name: "faqs"
      widget: "list"
      required: false
      summary: "{{fields.question}}"
      fields:
        - { label: "Question", name: "question", widget: "string" }
        - { label: "Answer", name: "answer", widget: "text" }
