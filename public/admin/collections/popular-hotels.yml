- label: "POPULAR HOTELS CAROUSEL SECTION"
  name: "popular_hotels_notice"
  widget: "instructions"
  description: "Controls the Popular Hotels carousel section on the Homepage."
  required: false

- label: "Show Popular Hotels Section on Homepage?"
  name: "enable_popular_hotels"
  widget: "boolean"
  default: true

- label: "Section Title"
  name: "popular_hotels_title"
  widget: "string"
  default: "Popular Hotels in Gulshan, Dhaka"

- label: "Section Subtitle"
  name: "popular_hotels_subtitle"
  widget: "text"
  default: "Handpicked top luxury & executive stays recommended by verified guest reviews."

- label: "Maximum Hotels to Show on Carousel"
  name: "max_hotels"
  widget: "number"
  value_type: "int"
  default: 10
  min: 1
  max: 20

- label: "Select Hotels & Drag to Set Serial Order"
  name: "featured_hotels"
  widget: "list"
  required: false
  hint: "Add hotels from dropdown and drag & drop to change serial order!"
  field:
    label: "Select Hotel"
    name: "hotel_slug"
    widget: "relation"
    collection: "hotels"
    search_fields: ["title"]
    value_field: "{{slug}}"
    display_fields: ["title"]
