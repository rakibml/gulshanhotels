- label: "3. AMENITIES & ROOM TYPES"
  name: "amenities_notice"
  widget: "instructions"
  description: "Controls top quick amenities grid, Booking.com-style categorized amenities modal, and room types."
  required: false

- label: "Show Amenities & Rooms Section?"
  name: "enable_amenities"
  widget: "boolean"
  default: true

- label: "Amenities Section Title"
  name: "amenities_title"
  widget: "string"
  default: "Amenities & Services"

# --- TOP 9 GRID AMENITIES (DISPLAYED ON MAIN PAGE GRID) ---
- label: "Top 9 Quick Grid Amenities (Displayed on Main Page)"
  name: "amenities"
  widget: "list"
  required: false
  fields:
    - label: "Amenity Name (e.g. Swimming Pool, Free Wi-Fi)"
      name: "name"
      widget: "string"

    - label: "Select Preset Icon"
      name: "icon"
      widget: "select"
      default: "checkmark"
      required: false
      options:
        - { label: "✔ Default Checkmark", value: "checkmark" }
        - { label: "🏊 Swimming Pool", value: "pool" }
        - { label: "🧖 Spa & Wellness", value: "spa" }
        - { label: "🏋️ Fitness Center / Gym", value: "gym" }
        - { label: "🍽️ Restaurant / Dining", value: "restaurant" }
        - { label: "📶 Free Wi-Fi", value: "wifi" }
        - { label: "🚗 Free Parking", value: "parking" }
        - { label: "✈️ Airport Shuttle", value: "shuttle" }
        - { label: "👔 Meeting & Events", value: "meeting" }
        - { label: "🛎️ 24/7 Room Service", value: "room_service" }
        - { label: "🧺 Laundry Service", value: "laundry" }

    - label: "Or Paste Custom Raw SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false

# --- BOOKING.COM STYLE CATEGORIZED AMENITIES FOR POPUP MODAL ---
- label: "Categorized Amenities (Booking.com Style Popup Modal List)"
  name: "categorized_amenities"
  widget: "list"
  required: false
  hint: "Add categories (e.g. Spa & Wellness, Business Facilities, Bathroom) with sub-items and optional tags (e.g. Free!, Additional charge)!"
  fields:
    - label: "Category Title (e.g. Spa & Wellness, Cleaning Services, Private bathroom)"
      name: "category_name"
      widget: "string"

    - label: "Category Icon Preset"
      name: "category_icon"
      widget: "select"
      default: "spa"
      required: false
      options:
        - { label: "🧖 Spa & Wellness", value: "spa" }
        - { label: "🏊 Outdoor Swimming Pool", value: "pool" }
        - { label: "🚿 Bathroom & Toiletries", value: "bath" }
        - { label: "🧺 Cleaning & Laundry Services", value: "laundry" }
        - { label: "👔 Business Facilities & Meetings", value: "meeting" }
        - { label: "🍳 Kitchen & Dining", value: "restaurant" }
        - { label: "🏙️ View & Balcony", value: "view" }
        - { label: "❄️ Air Conditioning & Climate", value: "ac" }
        - { label: "📶 Internet & Wi-Fi", value: "wifi" }
        - { label: "🚗 Parking & Transport", value: "parking" }
        - { label: "🔒 Safety & Security", value: "safe" }
        - { label: "🛎️ Front Desk Services", value: "room_service" }

    - label: "Or Paste Custom Category SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false

    - label: "Sub-items List Under This Category"
      name: "items"
      widget: "list"
      required: false
      fields:
        - label: "Sub-item Name (e.g. Full-body massage, Daily housekeeping, City view)"
          name: "name"
          widget: "string"

        - label: "Optional Badge Tag (e.g. Free!, Additional charge)"
          name: "badge"
          widget: "string"
          required: false
          hint: "e.g. 'Free!' or 'Additional charge'"

# --- ROOM TYPES ---
- label: "Room Types Section Title"
  name: "rooms_title"
  widget: "string"
  default: "Room Types"

- label: "Room Types Subtitle"
  name: "rooms_subtitle"
  widget: "string"
  default: "Explore all available rooms & suites"

- label: "Available Room Types & Suites"
  name: "rooms"
  widget: "list"
  required: false
  fields:
    - label: "Room Name (e.g. Deluxe Guest Room, 1 King Bed)"
      name: "name"
      widget: "string"

    - label: "Starting Price Text (e.g. $120 / night)"
      name: "price"
      widget: "string"
      required: false

    - label: "Room Size (e.g. 42 m² / 452 ft²)"
      name: "size"
      widget: "string"
      default: "42 m² / 452 ft²"
      required: false

    - label: "Max Guest Capacity (e.g. Max 2 Adults)"
      name: "guests"
      widget: "string"
      default: "Max 2 Adults"
      required: false

    - label: "Bed Configuration (e.g. 1 King Bed)"
      name: "bed"
      widget: "string"
      default: "1 King Bed"
      required: false

    - label: "Room Main Cover Image"
      name: "image"
      widget: "image"

    - label: "Room Image SEO Alt Text"
      name: "image_alt"
      widget: "string"
      required: false

    - label: "Room Multiple Photos Gallery"
      name: "photos"
      widget: "list"
      required: false
      field:
        label: "Photo"
        widget: "image"

    - label: "Room Badges"
      name: "badges"
      widget: "list"
      required: false
      field:
        label: "Badge Text"
        widget: "string"

    - label: "Room Quick Checklist Amenities"
      name: "checklist"
      widget: "list"
      required: false
      fields:
        - label: "Feature Name"
          name: "name"
          widget: "string"

        - label: "Select Preset Icon"
          name: "icon"
          widget: "select"
          default: "checkmark"
          required: false
          options:
            - { label: "✔ Default Checkmark", value: "checkmark" }
            - { label: "🏙️ City View", value: "view" }
            - { label: "❄️ Air Conditioning", value: "ac" }
            - { label: "🚿 Private Bathroom", value: "bath" }
            - { label: "☕ Electric Kettle", value: "kettle" }
            - { label: "💇 Hair Dryer", value: "dryer" }
            - { label: "🔒 In-Room Safe", value: "safe" }
            - { label: "💻 Work Desk", value: "desk" }
            - { label: "📶 High-Speed Wi-Fi", value: "wifi" }

        - label: "Custom SVG Icon"
          name: "custom_svg"
          widget: "text"
          required: false
