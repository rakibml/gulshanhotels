- label: "3. AMENITIES & ROOM TYPES"
  name: "amenities_notice"
  widget: "instructions"
  description: "Controls amenities list and room categories."
  required: false

- label: "Show Amenities Section?"
  name: "enable_amenities"
  widget: "boolean"
  default: true

- label: "Amenities List"
  name: "amenities"
  widget: "list"
  required: false
  field:
    label: "Amenity Name"
    widget: "string"

- label: "Available Room Types"
  name: "rooms"
  widget: "list"
  required: false
  fields:
    - label: "Room Name"
      name: "name"
      widget: "string"
    - label: "Price"
      name: "price"
      widget: "string"
    - label: "Max Guests"
      name: "guests"
      widget: "string"
    - label: "Bed Configuration"
      name: "bed"
      widget: "string"
    - label: "Room Size"
      name: "size"
      widget: "string"
