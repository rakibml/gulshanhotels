- label: "3. AMENITIES & ROOM TYPES"
  name: "amenities_notice"
  widget: "instructions"
  description: "Controls top amenities grid, 28+ amenities modal list, and Agoda-style room categories with room photo sliders, custom icons, checklists, and SEO alt text."
  required: false

# --- Section Show/Hide Toggle ---
- label: "Show Amenities & Rooms Section?"
  name: "enable_amenities"
  widget: "boolean"
  default: true

# --- Left Column: Amenities Control ---
- label: "Amenities Section Title"
  name: "amenities_title"
  widget: "string"
  default: "Amenities & Services"

- label: "Top Amenities List (Displayed on Grid)"
  name: "amenities"
  widget: "list"
  required: false
  fields:
    - label: "Amenity Name (e.g. Swimming Pool, Free Wi-Fi)"
      name: "name"
      widget: "string"

    - label: "Select Preset Icon"
      name: "icon"
      widget: "select"
      default: "checkmark"
      required: false
      options:
        - { label: "✔ Default Checkmark", value: "checkmark" }
        - { label: "🏊 Swimming Pool", value: "pool" }
        - { label: "🧖 Spa & Wellness", value: "spa" }
        - { label: "🏋️ Fitness Center / Gym", value: "gym" }
        - { label: "🍽️ Restaurant / Dining", value: "restaurant" }
        - { label: "📶 Free Wi-Fi", value: "wifi" }
        - { label: "🚗 Free Parking", value: "parking" }
        - { label: "✈️ Airport Transfer / Shuttle", value: "shuttle" }
        - { label: "👔 Meeting & Events", value: "meeting" }
        - { label: "🛎️ 24/7 Room Service", value: "room_service" }
        - { label: "🧺 Laundry Service", value: "laundry" }

    - label: "Or Paste Custom Raw SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false

# --- Right Column: Room Types Control ---
- label: "Room Types Section Title"
  name: "rooms_title"
  widget: "string"
  default: "Room Types"

- label: "Room Types Subtitle"
  name: "rooms_subtitle"
  widget: "string"
  default: "Explore all available rooms & suites"

- label: "Available Room Types & Suites"
  name: "rooms"
  widget: "list"
  required: false
  fields:
    - label: "Room Name (e.g. Deluxe Guest Room, 1 King Bed)"
      name: "name"
      widget: "string"

    - label: "Starting Price Text (e.g. $120 / night)"
      name: "price"
      widget: "string"
      required: false

    - label: "Room Size (e.g. 42 m² / 452 ft²)"
      name: "size"
      widget: "string"
      default: "42 m² / 452 ft²"
      required: false

    - label: "Max Guest Capacity (e.g. Max 2 Adults)"
      name: "guests"
      widget: "string"
      default: "Max 2 Adults"
      required: false

    - label: "Bed Configuration (e.g. 1 King Bed)"
      name: "bed"
      widget: "string"
      default: "1 King Bed"
      required: false

    - label: "Room Main Cover Image"
      name: "image"
      widget: "image"

    - label: "Room Image SEO Alt Text (Custom Keywords)"
      name: "image_alt"
      widget: "string"
      required: false
      hint: "e.g. 'Deluxe King Room Interior View at The Westin Dhaka'"

    - label: "Room Multiple Photos Gallery (For Card Slider & Modal)"
      name: "photos"
      widget: "list"
      required: false
      field:
        label: "Photo"
        widget: "image"

    - label: "Room Badges (e.g. Recommended, Preferred Choice)"
      name: "badges"
      widget: "list"
      required: false
      field:
        label: "Badge Text"
        widget: "string"

    - label: "Room Quick Checklist Amenities (With Custom Icons)"
      name: "checklist"
      widget: "list"
      required: false
      fields:
        - label: "Feature Name (e.g. City view, Air conditioning, Private bathroom)"
          name: "name"
          widget: "string"

        - label: "Select Preset Icon"
          name: "icon"
          widget: "select"
          default: "checkmark"
          required: false
          options:
            - { label: "✔ Default Checkmark", value: "checkmark" }
            - { label: "🏙️ City View", value: "view" }
            - { label: "❄️ Air Conditioning", value: "ac" }
            - { label: "🚿 Private Bathroom / Shower", value: "bath" }
            - { label: "☕ Electric Kettle / Coffee Maker", value: "kettle" }
            - { label: "💇 Hair Dryer", value: "dryer" }
            - { label: "🔒 In-Room Safe", value: "safe" }
            - { label: "💻 Work Desk", value: "desk" }
            - { label: "📶 High-Speed Wi-Fi", value: "wifi" }

        - label: "Or Paste Custom Raw SVG Icon Code (Optional)"
          name: "custom_svg"
          widget: "text"
          required: false
