- label: "3. AMENITIES & ROOM TYPES"
  name: "amenities_notice"
  widget: "instructions"
  description: "Controls top amenities grid, 28+ amenities modal list, and Agoda-style room categories with SEO alt text."
  required: false

# --- Section Show/Hide Toggle ---
- label: "Show Amenities & Rooms Section?"
  name: "enable_amenities"
  widget: "boolean"
  default: true

# --- Left Column: Amenities Control ---
- label: "Amenities Section Title"
  name: "amenities_title"
  widget: "string"
  default: "Amenities & Services"

- label: "Top Amenities List (Displayed on Grid)"
  name: "amenities"
  widget: "list"
  required: false
  field:
    label: "Amenity Name (e.g. Swimming Pool, Free Wi-Fi, Spa & Wellness)"
    name: "amenity"
    widget: "string"

# --- Right Column: Room Types Control ---
- label: "Room Types Section Title"
  name: "rooms_title"
  widget: "string"
  default: "Room Types"

- label: "Room Types Subtitle"
  name: "rooms_subtitle"
  widget: "string"
  default: "Explore all available rooms & suites"

- label: "Available Room Types & Suites"
  name: "rooms"
  widget: "list"
  required: false
  fields:
    - label: "Room Name (e.g. Deluxe Guest Room, 1 King Bed)"
      name: "name"
      widget: "string"

    - label: "Room Size (e.g. 42 m² / 452 ft²)"
      name: "size"
      widget: "string"
      default: "42 m² / 452 ft²"

    - label: "Max Guest Capacity (e.g. Max 2 Adults)"
      name: "guests"
      widget: "string"
      default: "Max 2 Adults"

    - label: "Bed Configuration (e.g. 1 King Bed)"
      name: "bed"
      widget: "string"
      default: "1 King Bed"

    - label: "Room Main Featured Image"
      name: "image"
      widget: "image"

    - label: "Room Image SEO Alt Text (Optional Custom Keywords)"
      name: "image_alt"
      widget: "string"
      required: false
      hint: "e.g. 'Deluxe King Room Interior View at The Westin Dhaka'"

    - label: "Room Photos Gallery (For Card Slider & Modal)"
      name: "photos"
      widget: "list"
      required: false
      field:
        label: "Photo"
        widget: "image"

    - label: "Room Badges (e.g. Recommended, Preferred Choice)"
      name: "badges"
      widget: "list"
      required: false
      field:
        label: "Badge Text"
        widget: "string"

    - label: "Room Features Checklist (2-Column Vector Checklist)"
      name: "checklist"
      widget: "list"
      required: false
      field:
        label: "Feature Name (e.g. City view, Air conditioning, Private bathroom)"
        widget: "string"
