- label: "5. GUEST REVIEWS & RATINGS"
  name: "reviews_notice"
  widget: "instructions"
  description: "Controls overall hotel rating, review counts, and approved traveler reviews."
  required: false

- label: "Overall Hotel Rating (e.g. 4.8)"
  name: "rating"
  widget: "string"
  default: "4.8"

- label: "Total Reviews Count (e.g. 125)"
  name: "reviewsCount"
  widget: "string"
  default: "125"

- label: "Approved Guest Reviews List"
  name: "reviews"
  widget: "list"
  required: false
  fields:
    - label: "Reviewer Name (e.g. Ismat F)"
      name: "name"
      widget: "string"

    - label: "Review Date (e.g. Aug 2026)"
      name: "date"
      widget: "string"

    - label: "Rating Stars (1 to 5)"
      name: "rating"
      widget: "select"
      default: "5"
      options:
        - { label: "★ ★ ★ ★ ★ 5 Stars", value: "5" }
        - { label: "★ ★ ★ ★ ☆ 4 Stars", value: "4" }
        - { label: "★ ★ ★ ☆ ☆ 3 Stars", value: "3" }
        - { label: "★ ★ ☆ ☆ ☆ 2 Stars", value: "2" }
        - { label: "★ ☆ ☆ ☆ ☆ 1 Star", value: "1" }

    - label: "Review Comment Text"
      name: "comment"
      widget: "text"
