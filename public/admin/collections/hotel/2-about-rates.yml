- label: "2. 📋 ABOUT HOTEL, POLICIES & RATES"
  name: "about_notice"
  widget: "instructions"
  description: "Overview text, check-in/out times, and custom booking channels."
  required: false

- label: "Starting Price Text"
  name: "price"
  widget: "string"
  default: "৳ 18,500 / night"

- label: "Check-In Time"
  name: "checkIn"
  widget: "string"
  default: "2:00 PM"
  required: false

- label: "Check-Out Time"
  name: "checkOut"
  widget: "string"
  default: "12:00 PM"
  required: false

- label: "Power Backup"
  name: "powerBackup"
  widget: "string"
  default: "24/7 Generator"
  required: false

- label: "Smoking Policy"
  name: "smokingPolicy"
  widget: "string"
  default: "Non-Smoking"
  required: false

- label: "Custom Booking Channels List"
  name: "booking_channels"
  widget: "list"
  collapsed: true
  required: false
  fields:
    - label: "Channel Name"
      name: "provider_name"
      widget: "string"

    - label: "Price Tag (Optional)"
      name: "price"
      widget: "string"
      required: false

    - label: "Show Price Tag?"
      name: "show_price"
      widget: "boolean"
      default: true

    - label: "Button Text"
      name: "button_text"
      widget: "string"
      default: "Book Now ➔"

    - label: "URL Link or Phone Number"
      name: "button_url"
      widget: "string"

    - label: "Top Badge Tag (Optional)"
      name: "badge"
      widget: "string"
      required: false

    - label: "Preset Icon"
      name: "icon_preset"
      widget: "select"
      default: "direct"
      options:
        - { label: "🔴 Agoda", value: "agoda" }
        - { label: "🔵 Booking.com", value: "booking" }
        - { label: "🟡 Expedia", value: "expedia" }
        - { label: "🏨 Direct Hotel", value: "direct" }
        - { label: "💬 WhatsApp", value: "whatsapp" }

    - label: "Custom SVG Code"
      name: "custom_svg"
      widget: "text"
      required: false

- label: "Official Site Link"
  name: "officialSite"
  widget: "string"
  required: false

- label: "WhatsApp Number"
  name: "whatsapp"
  widget: "string"
  required: false

- label: "Phone Number"
  name: "phone"
  widget: "string"
  required: false

- label: "Hotel Overview Description"
  name: "body"
  widget: "markdown"
