# ==============================================================================
# 2. ABOUT HOTEL & LIVE RATES (RESERVATIONS & BOOKING CHANNELS)
# ==============================================================================
- label: "2. ABOUT HOTEL & LIVE RATES"
  name: "about_notice"
  widget: "instructions"
  description: "Controls overview description, starting price, and live booking channels (Agoda, Booking, Direct, etc.)."
  required: false

# --- Overview Text ---
- label: "Hotel Description / About Overview"
  name: "body"
  widget: "markdown"
  hint: "Write the detailed description and overview of the hotel."

- label: "Starting Price Text (e.g. $120 / night or ৳ 18,500)"
  name: "price"
  widget: "string"
  default: "৳ 18,500 / night"

# --- 100% CUSTOM BOOKING CHANNELS LIST (DRAG & DROP SERIAL) ---
- label: "Booking Channels List (Full Admin Control & Drag-and-Drop Order)"
  name: "booking_channels"
  widget: "list"
  required: false
  hint: "Add, reorder (drag & drop serial), set custom SVG logo, price, badges, and button text!"
  fields:
    - label: "Channel Name / Title (e.g. Agoda, Official Site, WhatsApp Booking)"
      name: "provider_name"
      widget: "string"

    - label: "Price Text (Optional - Leave blank for no price tag)"
      name: "price"
      widget: "string"
      required: false
      hint: "e.g. '$114' or '৳ 12,500' (Leave empty if you don't want to show price)"

    - label: "Show Price Tag on Website?"
      name: "show_price"
      widget: "boolean"
      default: true

    - label: "Button Action Text (e.g. Book Now ➔, View Deal, Chat on WhatsApp)"
      name: "button_text"
      widget: "string"
      default: "Book Now ➔"

    - label: "Destination URL Link or Phone Number"
      name: "button_url"
      widget: "string"
      hint: "e.g. https://www.agoda.com/... or phone number 01700000000"

    - label: "Top Badge Tag (Optional - e.g. Recommended, Official Site, Best Rate)"
      name: "badge"
      widget: "string"
      required: false
      hint: "e.g. 'Recommended', 'Official Site', 'Best Rate'"

    - label: "Preset Logo Icon"
      name: "icon_preset"
      widget: "select"
      default: "direct"
      required: false
      options:
        - { label: "🔴 Agoda", value: "agoda" }
        - { label: "🔵 Booking.com", value: "booking" }
        - { label: "🟡 Expedia", value: "expedia" }
        - { label: "🏨 Direct Hotel / Building", value: "direct" }
        - { label: "💬 WhatsApp", value: "whatsapp" }
        - { label: "📞 Phone Call", value: "phone" }

    - label: "Or Paste Custom Raw SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false
      hint: "Paste raw <svg>...</svg> code here to display any custom brand logo!"

# --- Direct Contacts ---
- label: "Official Hotel Website Link (Optional)"
  name: "officialSite"
  widget: "string"
  required: false

- label: "WhatsApp Reservation Number (e.g. 8801700000000)"
  name: "whatsapp"
  widget: "string"
  required: false

- label: "Direct Phone Number (e.g. +8801700000000)"
  name: "phone"
  widget: "string"
  required: false

# ==============================================================================
# 3. HOTEL POLICIES & HOUSE RULES (NOW A SEPARATE DEDICATED SECTION)
# ==============================================================================
- label: "3. HOTEL POLICIES & HOUSE RULES"
  name: "policies_notice"
  widget: "instructions"
  description: "Controls check-in/out times, children & extra beds, age restrictions, pet rules, and house guidelines."
  required: false

- label: "Enable Hotel Policies Section on Website?"
  name: "enable_policies"
  widget: "boolean"
  default: true
  required: false

- label: "Hotel Policies List (Full Drag-and-Drop Admin Control)"
  name: "policies"
  widget: "list"
  required: false
  summary: "{{fields.label}}: {{fields.value}}"
  hint: "Click '+ Add' to add any policy! Drag and drop to reorder."
  fields:
    - label: "Policy Title / Name"
      name: "label"
      widget: "string"
      hint: "e.g. Check-In, Check-Out, Children & Beds, Age Restriction, Pets, Cancellation, Couple Policy"

    - label: "Policy Detail / Value (Supports Large Paragraphs & Line Breaks)"
      name: "value"
      widget: "text" # <--- 'text' widget হওয়ায় যত বড় লেখাই হোক প্যারাগ্রাফ সহ লেখা যাবে
      hint: "Write the policy details here. You can write multiple lines, paragraphs, and bullet points."

    - label: "Custom SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false
      hint: "Paste raw <svg>...</svg> code here for unique icons! (Leave blank to use smart auto-detected icons)"
