- label: "2. ABOUT HOTEL & LIVE STAY22 RATES"
  name: "about_notice"
  widget: "instructions"
  description: "Controls overview description, starting price, hotel policies, and booking channels."
  required: false

- label: "Starting Price Text (e.g. $120 / night or ৳ 18,500)"
  name: "price"
  widget: "string"
  default: "৳ 18,500 / night"

# --- Hotel Policies & Info (100% Admin Controllable) ---
- label: "Check-In Time (e.g. 2:00 PM)"
  name: "checkIn"
  widget: "string"
  default: "2:00 PM"
  required: false

- label: "Check-Out Time (e.g. 12:00 PM)"
  name: "checkOut"
  widget: "string"
  default: "12:00 PM"
  required: false

- label: "Power Backup Status (e.g. 24/7 Generator)"
  name: "powerBackup"
  widget: "string"
  default: "24/7 Generator"
  required: false

- label: "Smoking Policy (e.g. Non-Smoking)"
  name: "smokingPolicy"
  widget: "string"
  default: "Non-Smoking"
  required: false

# --- Reservation Channels ---
- label: "Show Live Stay22 OTA Rate Comparison Table?"
  name: "enable_rates"
  widget: "boolean"
  default: true

- label: "Official Hotel Website Link (Optional)"
  name: "officialSite"
  widget: "string"
  required: false

- label: "WhatsApp Reservation Number (e.g. 8801700000000)"
  name: "whatsapp"
  widget: "string"
  required: false

- label: "Direct Phone Number (e.g. +8801700000000)"
  name: "phone"
  widget: "string"
  required: false

# --- Overview Text ---
- label: "Hotel Description / About"
  name: "body"
  widget: "markdown"
