# ==============================================================================
# 2. ABOUT HOTEL & LIVE RATES (RESERVATIONS & BOOKING CHANNELS)
# ==============================================================================
- label: "2. ABOUT HOTEL & LIVE RATES"
  name: "about_notice"
  widget: "instructions"
  description: "Controls overview description, starting price, Agoda live sync, and all booking channels."
  required: false

# --- Overview Text ---
- label: "Hotel Description / About Overview"
  name: "body"
  widget: "markdown"
  hint: "Write the detailed description and overview of the hotel."

- label: "Starting Price Text (e.g. $120 / night or ৳ 18,500)"
  name: "price"
  widget: "string"
  default: "$120"
  hint: "Default starting price shown when live rate is loading or offline."

# --- AGODA LIVE SYNC CONTROLS ---
- label: "Agoda Hotel ID (For Instant Live Price Sync)"
  name: "agoda_id"
  widget: "string"
  required: false
  hint: "Numeric hotel ID from Agoda URL (e.g. 348841). If empty, auto-matches by hotel title."

- label: "Direct Agoda Affiliate Link (Optional)"
  name: "agoda_url"
  widget: "string"
  required: false
  hint: "Paste direct Agoda affiliate link here if you don't want the auto-generated link."

- label: "Custom Agoda Partner CID (Optional)"
  name: "agoda_cid"
  widget: "string"
  required: false
  hint: "Your custom Agoda affiliate CID for tracking bookings."

# --- DEALS SECTION TITLES ---
- label: "Deals Card Section Title"
  name: "deals_title"
  widget: "string"
  default: "Deals"
  required: false
  hint: "Title shown above the rates table (e.g. Deals, Room Rates & Deals)."

# --- 100% CUSTOM BOOKING CHANNELS LIST (DRAG & DROP SERIAL) ---
- label: "Booking Channels List (Full Admin Control & Drag-and-Drop Order)"
  name: "booking_channels"
  widget: "list"
  required: false
  summary: "{{fields.provider_name}} - {{fields.price}}"
  hint: "Add, reorder (drag & drop serial), set custom logo, price, badges, notes, and button text!"
  fields:
    - label: "Channel Name / Title (e.g. Agoda, Official Site, Booking.com)"
      name: "provider_name"
      widget: "string"

    - label: "Price Text (Optional - Leave blank for no price tag)"
      name: "price"
      widget: "string"
      required: false
      hint: "e.g. '$114' or '৳ 12,500' (Leave empty if you don't want to show price)"

    - label: "Show Price Tag on Website?"
      name: "show_price"
      widget: "boolean"
      default: true

    - label: "Special Feature / Note (e.g. Free cancellation, Breakfast included)"
      name: "note"
      widget: "string"
      required: false
      hint: "Short highlight displayed next to the logo on desktop (e.g. 'Free cancellation')."

    - label: "Button Action Text (e.g. View deal, Book Now ➔, Chat on WhatsApp)"
      name: "button_text"
      widget: "string"
      default: "View deal"

    - label: "Destination URL Link or Phone Number"
      name: "button_url"
      widget: "string"
      hint: "e.g. https://www.booking.com/... or phone number 01700000000"

    - label: "Top Badge Tag (Optional)"
      name: "badge"
      widget: "string"
      required: false
      hint: "e.g. 'Recommended', 'Official Site', 'Best Rate'"

    - label: "Channel Image Logo URL (Optional)"
      name: "logo_url"
      widget: "image"
      required: false
      hint: "Upload or select a custom brand logo image (overrides preset)."

    - label: "Preset Logo Icon"
      name: "icon_preset"
      widget: "select"
      default: "direct"
      required: false
      options:
        - { label: "🔴 Agoda", value: "agoda" }
        - { label: "🔵 Booking.com", value: "booking" }
        - { label: "🟠 Trip.com", value: "trip" }
        - { label: "🟢 TripAdvisor", value: "tripadvisor" }
        - { label: "🟡 Expedia", value: "expedia" }
        - { label: "🏨 Direct Hotel / Building", value: "direct" }
        - { label: "💬 WhatsApp", value: "whatsapp" }
        - { label: "📞 Phone Call", value: "phone" }

    - label: "Or Paste Custom Raw SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false
      hint: "Paste raw <svg>...</svg> code here to display any custom brand logo!"

# --- Direct Contacts ---
- label: "Official Hotel Website Link (Optional)"
  name: "officialSite"
  widget: "string"
  required: false

- label: "WhatsApp Reservation Number (e.g. 8801700000000)"
  name: "whatsapp"
  widget: "string"
  required: false

- label: "Direct Phone Number (e.g. +8801700000000)"
  name: "phone"
  widget: "string"
  required: false

- label: "Rates Disclaimer Note (Bottom text)"
  name: "rates_disclaimer"
  widget: "text"
  required: false
  default: "Prices are provided by our partners and reflect nightly room rates. Taxes may not be included. We may earn a commission at no extra cost to you."

# ==============================================================================
# 3. HOTEL POLICIES & HOUSE RULES
# ==============================================================================
- label: "3. HOTEL POLICIES & HOUSE RULES"
  name: "policies_notice"
  widget: "instructions"
  description: "Configure Booking.com style policies: Check-in/out, Child & Bed tables, and Payment method logos."
  required: false

- label: "Enable Hotel Policies Section?"
  name: "enable_policies"
  widget: "boolean"
  default: true
  required: false

- label: "Check-in Schedule"
  name: "check_in"
  widget: "string"
  default: "Available 24 hours"
  hint: "e.g. 'From 14:00 to 00:00' or 'Available 24 hours'"

- label: "Check-out Schedule"
  name: "check_out"
  widget: "string"
  default: "Available 24 hours"
  hint: "e.g. 'From 06:00 to 12:00' or 'Available 24 hours'"

- label: "Cancellation / Prepayment Policy (Supports Markdown Links)"
  name: "cancellation_policy"
  widget: "markdown"
  default: "Cancellation and prepayment policies vary according to accommodation type. Please check what [conditions](#rates-card) apply to each option when making your selection."

# --- CHILDREN & BEDS ---
- label: "Child Policies General Rules"
  name: "child_policy_text"
  widget: "text"
  default: |
    Children of all ages are welcome.
    Children 9 and above will be charged as adults at this property.
    To see correct prices and occupancy info, add the number and ages of children in your group to your search.

- label: "Cribs & Extra Beds Table (Structured List)"
  name: "extra_beds"
  widget: "list"
  required: false
  summary: "{{fields.age}}: {{fields.type}} ({{fields.price}})"
  fields:
    - label: "Age Tier / Range"
      name: "age"
      widget: "string"
      default: "1 - 6 years"
    - label: "Bed Type"
      name: "type"
      widget: "string"
      default: "Crib upon request"
    - label: "Price / Charge"
      name: "price"
      widget: "string"
      default: "Free"

- label: "Cribs & Extra Beds Disclaimer Notes"
  name: "extra_beds_notes"
  widget: "text"
  default: |
    Prices for cribs and extra beds aren't included in the total price. They'll have to be paid for separately during your stay.
    The number of extra beds and cribs allowed depends on the option you choose. Check your selected option for more info.
    All cribs and extra beds are subject to availability.

- label: "Minimum Check-in Age"
  name: "age_restriction"
  widget: "string"
  default: "The minimum age for check-in is 18"

- label: "Pets Policy"
  name: "pets_policy"
  widget: "string"
  default: "Pets are not allowed."

# --- PAYMENT METHOD LOGOS ---
- label: "Accepted Payment Methods"
  name: "payment_methods"
  widget: "select"
  multiple: true
  default: ["amex", "visa", "mastercard", "unionpay", "cash"]
  options:
    - { label: "American Express (Amex)", value: "amex" }
    - { label: "Visa", value: "visa" }
    - { label: "MasterCard", value: "mastercard" }
    - { label: "UnionPay", value: "unionpay" }
    - { label: "Cash on Arrival", value: "cash" }
    - { label: "bKash", value: "bkash" }
    - { label: "Nagad", value: "nagad" }

# --- ADDITIONAL CUSTOM POLICIES ---
- label: "Other Custom Policies (Optional)"
  name: "custom_policies"
  widget: "list"
  required: false
  summary: "{{fields.label}}: {{fields.value}}"
  fields:
    - label: "Policy Title"
      name: "label"
      widget: "string"
      hint: "e.g. Couple Policy, Smoking Policy, Quiet Hours"
    - label: "Policy Details"
      name: "value"
      widget: "text"
