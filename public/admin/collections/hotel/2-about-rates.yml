- label: "2. ABOUT HOTEL & LIVE RATES"
  name: "about_notice"
  widget: "instructions"
  description: "Controls overview description, starting price, hotel policies, and custom booking channels."
  required: false

- label: "Starting Price Text (e.g. $120 / night or ৳ 18,500)"
  name: "price"
  widget: "string"
  default: "৳ 18,500 / night"

# --- Hotel Policies ---
- label: "Check-In Time (e.g. 2:00 PM)"
  name: "checkIn"
  widget: "string"
  default: "2:00 PM"
  required: false

- label: "Check-Out Time (e.g. 12:00 PM)"
  name: "checkOut"
  widget: "string"
  default: "12:00 PM"
  required: false

- label: "Power Backup Status (e.g. 24/7 Generator)"
  name: "powerBackup"
  widget: "string"
  default: "24/7 Generator"
  required: false

- label: "Smoking Policy (e.g. Non-Smoking)"
  name: "smokingPolicy"
  widget: "string"
  default: "Non-Smoking"
  required: false

# --- 100% CUSTOM BOOKING CHANNELS LIST (DRAG & DROP SERIAL IN SVELTIA CMS) ---
- label: "Booking Channels List (Full Admin Control & Drag-and-Drop Order)"
  name: "booking_channels"
  widget: "list"
  required: false
  hint: "Add, reorder (drag & drop serial), set custom SVG logo, price, badges, and button text!"
  fields:
    - label: "Channel Name / Title (e.g. Agoda, Official Site, WhatsApp Booking)"
      name: "provider_name"
      widget: "string"

    - label: "Price Text (Optional - Leave blank for no price tag)"
      name: "price"
      widget: "string"
      required: false
      hint: "e.g. '$114' or '৳ 12,500' (Leave empty if you don't want to show price)"

    - label: "Show Price Tag on Website?"
      name: "show_price"
      widget: "boolean"
      default: true

    - label: "Button Action Text (e.g. Book Now ➔, View Deal, Chat on WhatsApp)"
      name: "button_text"
      widget: "string"
      default: "Book Now ➔"

    - label: "Destination URL Link or Phone Number"
      name: "button_url"
      widget: "string"
      hint: "e.g. https://www.agoda.com/... or phone number 01700000000"

    - label: "Top Badge Tag (Optional - e.g. Recommended, Official Site, Best Rate)"
      name: "badge"
      widget: "string"
      required: false
      hint: "e.g. 'Recommended', 'Official Site', 'Best Rate'"

    - label: "Preset Logo Icon"
      name: "icon_preset"
      widget: "select"
      default: "direct"
      required: false
      options:
        - { label: "🔴 Agoda", value: "agoda" }
        - { label: "🔵 Booking.com", value: "booking" }
        - { label: "🟡 Expedia", value: "expedia" }
        - { label: "🏨 Direct Hotel / Building", value: "direct" }
        - { label: "💬 WhatsApp", value: "whatsapp" }
        - { label: "📞 Phone Call", value: "phone" }

    - label: "Or Paste Custom Raw SVG Icon Code (Optional)"
      name: "custom_svg"
      widget: "text"
      required: false
      hint: "Paste raw <svg>...</svg> code here to display any custom brand logo!"

# --- Reservation Contacts ---
- label: "Official Hotel Website Link (Optional)"
  name: "officialSite"
  widget: "string"
  required: false

- label: "WhatsApp Reservation Number (e.g. 8801700000000)"
  name: "whatsapp"
  widget: "string"
  required: false

- label: "Direct Phone Number (e.g. +8801700000000)"
  name: "phone"
  widget: "string"
  required: false

# --- Overview Text ---
- label: "Hotel Description / About"
  name: "body"
  widget: "markdown"
