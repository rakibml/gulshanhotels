# ==============================================================================
# 2. ABOUT HOTEL & LIVE RATES (RESERVATIONS & BOOKING CHANNELS)
# ==============================================================================
- label: "2. ABOUT HOTEL & LIVE RATES"
  name: "about_notice"
  widget: "instructions"
  description: "Controls overview description, starting price, Agoda live sync, and all booking channels. শুধু সত্যি তথ্য লিখুন। না জানলে ফাঁকা রাখুন।"
  required: false

# --- Overview Text ---
- label: "Hotel Description / About Overview"
  name: "body"
  widget: "markdown"
  hint: "নিজের ভাষায় লিখুন। অন্য সাইট থেকে কপি করবেন না।"

- label: "Starting Price Text (e.g. $120 / night or ৳ 18,500)"
  name: "price"
  widget: "string"
  required: false
  hint: "শুধু সত্যি দাম লিখুন। না জানলে ফাঁকা রাখুন।"

# --- AGODA LIVE SYNC CONTROLS ---
- label: "Agoda Hotel ID (For Instant Live Price Sync)"
  name: "agoda_id"
  widget: "string"
  required: false
  hint: "Agoda URL থেকে hotel ID (যেমন 348841)। ফাঁকা থাকলে hotel-এর নাম দিয়ে খুঁজবে।"

- label: "Direct Agoda Affiliate Link (Optional)"
  name: "agoda_url"
  widget: "string"
  required: false
  hint: "নিজের Agoda affiliate link এখানে দিন। না দিলে auto link হবে।"

- label: "Custom Agoda Partner CID (Optional)"
  name: "agoda_cid"
  widget: "string"
  required: false
  hint: "Booking ট্র্যাক করার জন্য আপনার Agoda CID।"

# --- DEALS SECTION TITLE ---
- label: "Deals Card Section Title"
  name: "deals_title"
  widget: "string"
  default: "Deals & Rates"
  required: false
  hint: "Rates card-এর উপরের শিরোনাম।"

# --- BOOKING CHANNELS LIST ---
- label: "Booking Channels List (Drag-and-Drop Order)"
  name: "booking_channels"
  widget: "list"
  required: false
  summary: "{{fields.provider_name}} - {{fields.price}}"
  hint: "চ্যানেল যোগ করুন, সাজান, দাম ও নোট দিন।"
  fields:
    - label: "Channel Name / Title (e.g. Agoda, Official Site)"
      name: "provider_name"
      widget: "string"

    - label: "Price Text (Optional)"
      name: "price"
      widget: "string"
      required: false
      hint: "যেমন '$114' বা '৳ 12,500'। দাম না জানলে ফাঁকা রাখুন।"

    - label: "Show Price Tag on Website?"
      name: "show_price"
      widget: "boolean"
      default: true

    - label: "Special Feature / Note (Optional)"
      name: "note"
      widget: "string"
      required: false
      hint: "শুধু সত্যি জিনিস লিখুন (যেমন Free cancellation)। না জানলে ফাঁকা রাখুন।"

    - label: "Button Action Text"
      name: "button_text"
      widget: "string"
      default: "View deal"

    - label: "Destination URL Link or Phone Number"
      name: "button_url"
      widget: "string"
      hint: "যেমন https://www.booking.com/... বা ফোন নম্বর 01700000000"

    - label: "Top Badge Tag (Optional)"
      name: "badge"
      widget: "select"
      required: false
      hint: "'Best Rate' বা 'Cheapest' এখানে নেই, কারণ সবচেয়ে কম দাম সাইট নিজেই চিনে নেয়।"
      options:
        - { label: "Official Site", value: "Official Site" }
        - { label: "Partner", value: "Partner" }
        - { label: "Recommended", value: "Recommended" }

    - label: "Channel Image Logo (Optional)"
      name: "logo_url"
      widget: "image"
      required: false
      hint: "শুধু যাদের লোগো ব্যবহারের অনুমতি আছে তাদের লোগো দিন।"

    - label: "Preset Logo Icon"
      name: "icon_preset"
      widget: "select"
      default: "direct"
      required: false
      options:
        - { label: "🔴 Agoda", value: "agoda" }
        - { label: "🔵 Booking.com", value: "booking" }
        - { label: "🟠 Trip.com", value: "trip" }
        - { label: "🟢 TripAdvisor", value: "tripadvisor" }
        - { label: "🟡 Expedia", value: "expedia" }
        - { label: "🏨 Direct Hotel / Other", value: "direct" }
        - { label: "💬 WhatsApp", value: "whatsapp" }
        - { label: "📞 Phone Call", value: "phone" }

# --- Direct Contacts ---
- label: "Official Hotel Website Link (Optional)"
  name: "officialSite"
  widget: "string"
  required: false

- label: "WhatsApp Reservation Number (e.g. 8801700000000)"
  name: "whatsapp"
  widget: "string"
  required: false

- label: "Direct Phone Number (e.g. +8801700000000)"
  name: "phone"
  widget: "string"
  required: false

# commission-এর কথা কম্পোনেন্টে সবসময় দেখায়, এখানে মোছা যায় না।
- label: "Rates Disclaimer Note (Bottom text)"
  name: "rates_disclaimer"
  widget: "text"
  required: false
  default: "Prices are provided by our partners and reflect nightly room rates. Taxes may not be included."

# ==============================================================================
# 3. HOTEL POLICIES & HOUSE RULES
# ==============================================================================
- label: "3. HOTEL POLICIES & HOUSE RULES"
  name: "policies_notice"
  widget: "instructions"
  description: "এই অংশের সব তথ্য hotel থেকে নিশ্চিত হয়ে লিখুন। না জানলে ফাঁকা রাখুন, ফাঁকা অংশ সাইটে দেখাবেন না।"
  required: false

- label: "Enable Hotel Policies Section?"
  name: "enable_policies"
  widget: "boolean"
  default: true
  required: false

- label: "Check-in Schedule"
  name: "check_in"
  widget: "string"
  required: false
  hint: "যেমন 'From 14:00 to 00:00' বা 'Available 24 hours'"

- label: "Check-out Schedule"
  name: "check_out"
  widget: "string"
  required: false
  hint: "যেমন 'From 06:00 to 12:00'"

- label: "Cancellation / Prepayment Policy (Supports Markdown Links)"
  name: "cancellation_policy"
  widget: "markdown"
  required: false

# --- CHILDREN & BEDS ---
- label: "Child Policies General Rules"
  name: "child_policy_text"
  widget: "text"
  required: false

- label: "Cribs & Extra Beds Table (Structured List)"
  name: "extra_beds"
  widget: "list"
  required: false
  summary: "{{fields.age}}: {{fields.type}} ({{fields.price}})"
  fields:
    - label: "Age Tier / Range"
      name: "age"
      widget: "string"
    - label: "Bed Type"
      name: "type"
      widget: "string"
    - label: "Price / Charge"
      name: "price"
      widget: "string"

- label: "Cribs & Extra Beds Disclaimer Notes"
  name: "extra_beds_notes"
  widget: "text"
  required: false

- label: "Minimum Check-in Age"
  name: "age_restriction"
  widget: "string"
  required: false

- label: "Pets Policy"
  name: "pets_policy"
  widget: "string"
  required: false

# --- PAYMENT METHOD LOGOS ---
- label: "Accepted Payment Methods"
  name: "payment_methods"
  widget: "select"
  multiple: true
  required: false
  options:
    - { label: "American Express (Amex)", value: "amex" }
    - { label: "Visa", value: "visa" }
    - { label: "MasterCard", value: "mastercard" }
    - { label: "UnionPay", value: "unionpay" }
    - { label: "Cash on Arrival", value: "cash" }
    - { label: "bKash", value: "bkash" }
    - { label: "Nagad", value: "nagad" }

# --- ADDITIONAL CUSTOM POLICIES ---
- label: "Other Custom Policies (Optional)"
  name: "custom_policies"
  widget: "list"
  required: false
  summary: "{{fields.label}}: {{fields.value}}"
  fields:
    - label: "Policy Title"
      name: "label"
      widget: "string"
      hint: "যেমন Couple Policy, Smoking Policy, Quiet Hours"
    - label: "Policy Details"
      name: "value"
      widget: "text"
