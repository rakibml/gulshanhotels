- label: "6. FREQUENTLY ASKED QUESTIONS (FAQS)"
  name: "faqs_notice"
  widget: "instructions"
  description: "Controls travelers FAQ section, question accordions, and custom Q&A list."
  required: false

- label: "FAQ Section Title"
  name: "faqs_title"
  widget: "string"
  default: "Travelers are asking"

- label: "Frequently Asked Questions List"
  name: "faqs"
  widget: "list"
  required: false
  summary: "{{question}}"
  fields:
    - label: "Question (e.g. Do they serve breakfast?)"
      name: "question"
      widget: "string"
    - label: "Answer Text"
      name: "answer"
      widget: "text"
