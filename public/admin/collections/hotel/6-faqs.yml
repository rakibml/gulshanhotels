- label: "6. FAQS ACCORDION"
  name: "faqs_notice"
  widget: "instructions"
  description: "Controls questions and answers for Google Rich Snippets."
  required: false

- label: "Show FAQs Section?"
  name: "enable_faqs"
  widget: "boolean"
  default: true

- label: "Frequently Asked Questions"
  name: "faqs"
  widget: "list"
  required: false
  fields:
    - label: "Question"
      name: "question"
      widget: "string"
    - label: "Answer"
      name: "answer"
      widget: "text"
