# --- INSIDER TIPS FOR GUESTS (HIGH SEO INFORMATION GAIN) ---
- label: "Insider Tips for Guests (High Google Value)"
  name: "insider_tips"
  widget: "list"
  required: false
  summary: "{{fields.title}}: {{fields.tip}}"
  hint: "Add real insider advice! e.g., Best floor for lake view, quiet room requests, transit advice, or dining tips."
  fields:
    - label: "Tip Headline / Topic"
      name: "title"
      widget: "string"
      hint: "e.g. Best View Rooms, Quiet Stay Secret, Airport Transit Tip, Breakfast Secret"

    - label: "The Insider Advice / Tip Details"
      name: "tip"
      widget: "text"
      hint: "Write practical advice for travelers that Booking.com doesn't mention."

    - label: "Badge Tag (Optional)"
      name: "tag"
      widget: "string"
      required: false
      hint: "e.g. Pro Tip, Best View, Transit Advice, Local Secret"

    - label: "Category (Selects Matching Pure Vector Icon)"
      name: "category"
      widget: "select"
      default: "room"
      options:
        - { label: "Room & View Advice", value: "room" }
        - { label: "Airport & Transit", value: "transit" }
        - { label: "Dining & Breakfast", value: "dining" }
        - { label: "Quiet & Peaceful Stay", value: "quiet" }
        - { label: "General Secret Tip", value: "general" }
