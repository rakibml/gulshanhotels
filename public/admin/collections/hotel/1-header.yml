- label: "1. HOTEL HEADER & HERO BANNER"
  name: "header_notice"
  widget: "instructions"
  description: "Controls hotel title, SEO meta, category, verified status, location & gallery photos."
  required: false

- label: "Hotel Name / Title"
  name: "title"
  widget: "string"

- label: "Custom SEO Meta Title (Max 60 Chars)"
  name: "seo_title"
  widget: "string"
  required: false
  hint: "Optional. Leave blank to auto-generate: [Hotel Name]: 5-Star Hotel in [Area], Dhaka"

- label: "Custom SEO Meta Description (Max 155 Chars)"
  name: "seo_description"
  widget: "text"
  required: false
  hint: "Describe rooms, rates & amenities within 150 characters to avoid Google truncation."

- label: "Is this Hotel Officially Verified?"
  name: "is_verified"
  widget: "boolean"
  default: false
  hint: "Toggle ON only if official amenities and star-rating have been verified."

- label: "Category (e.g. 5-Star Luxury Stay)"
  name: "category"
  widget: "string"
  default: "5-Star Luxury Stay"

- label: "Area Ranking / Highlight (Optional)"
  name: "ranking"
  widget: "string"
  required: false
  hint: "e.g. #1 of 32 Luxury Stays in Gulshan 2"

- label: "Short Location (e.g. Road 41, Gulshan 2, Dhaka)"
  name: "location"
  widget: "string"
  default: "Gulshan 2, Dhaka, Bangladesh"

- label: "Google Map Link (Optional)"
  name: "map_url"
  widget: "string"
  required: false
  default: "#location-map"

- label: "Cover Image (Main Hero Photo)"
  name: "image"
  widget: "image"

- label: "Photo Gallery (Multiple Photos)"
  name: "gallery"
  widget: "list"
  required: false
  field:
    label: "Photo"
    widget: "image"

- label: "Show in Popular Hotels Carousel on Homepage?"
  name: "popular"
  widget: "boolean"
  default: true

- label: "Make this Hotel Sponsored / Spotlight on Homepage?"
  name: "sponsored"
  widget: "boolean"
  default: false

- label: "Sponsored Spotlight Custom Tagline (Optional)"
  name: "spotlight_desc"
  widget: "string"
  required: false
