- label: "1. HOTEL HEADER & HERO BANNER"
  name: "header_notice"
  widget: "instructions"
  description: "Controls main title, title typography style, category, location, cover photo & buttons."
  required: false

- label: "Hotel Name / Title"
  name: "title"
  widget: "string"

- label: "Hotel Title Typography & Color Style"
  name: "title_style"
  widget: "select"
  default: "style_1"
  options:
    - { label: "Style 1: Serif Classic Bold (Default)", value: "style_1" }
    - { label: "Style 2: Luxury Gold Gradient", value: "style_2" }
    - { label: "Style 3: Emerald Forest Gradient", value: "style_3" }
    - { label: "Style 4: Modern Sans Extrabold", value: "style_4" }
    - { label: "Style 5: Elegant Serif Italic", value: "style_5" }
    - { label: "Style 6: Dark Slate Compact", value: "style_6" }
    - { label: "Style 7: Royal Navy Shadow", value: "style_7" }
    - { label: "Style 8: Minimalist Spaced Uppercase", value: "style_8" }
    - { label: "Style 9: Classic Underline Gold", value: "style_9" }
    - { label: "Style 10: Emerald Accent Underline", value: "style_10" }
    - { label: "Style 11: Bold Headline Sans", value: "style_11" }
    - { label: "Style 12: Soft Copper Serif", value: "style_12" }
    - { label: "Style 13: Deep Forest Luxury", value: "style_13" }
    - { label: "Style 14: Vintage Regular Serif", value: "style_14" }
    - { label: "Style 15: High Contrast Uppercase", value: "style_15" }
    - { label: "Style 16: Sunset Amber Gradient", value: "style_16" }
    - { label: "Style 17: Charcoal Medium Serif", value: "style_17" }
    - { label: "Style 18: Emerald Left Accent Bar", value: "style_18" }
    - { label: "Style 19: Amber Left Accent Bar", value: "style_19" }
    - { label: "Style 20: Clean Business Sans", value: "style_20" }
    - { label: "Style 21: Diplomatic Navy Serif", value: "style_21" }
    - { label: "Style 22: Display Black Sans", value: "style_22" }
    - { label: "Style 23: Gold Bottom Bar", value: "style_23" }
    - { label: "Style 24: Sleek Silver Serif", value: "style_24" }
    - { label: "Style 25: Earth Warm Stone", value: "style_25" }
    - { label: "Style 26: Deep Teal Luxury", value: "style_26" }
    - { label: "Style 27: Pure Black Bold", value: "style_27" }
    - { label: "Style 28: Italic Display Serif", value: "style_28" }
    - { label: "Style 29: Emerald Soft Glow", value: "style_29" }
    - { label: "Style 30: Royal Amber Gold", value: "style_30" }

- label: "Category (e.g. 5-Star Luxury Stay)"
  name: "category"
  widget: "string"
  default: "5-Star Luxury Stay"

- label: "Location Address"
  name: "location"
  widget: "string"
  default: "Main Gulshan Avenue, Gulshan 2, Dhaka 1212, Bangladesh"

- label: "Short Tagline Description"
  name: "description"
  widget: "text"
  required: false

- label: "Official Website Link (URL)"
  name: "officialSite"
  widget: "string"
  required: false
  hint: "e.g. https://www.panpacific.com/dhaka"

- label: "Cover Image (Main Hero Photo)"
  name: "image"
  widget: "image"

- label: "Photo Gallery (Multiple Photos)"
  name: "gallery"
  widget: "list"
  required: false
  field:
    label: "Photo"
    widget: "image"

- label: "Show 'View Prices' Button?"
  name: "enable_view_prices"
  widget: "boolean"
  default: true

- label: "Show 'Official Website' Button?"
  name: "enable_official_site"
  widget: "boolean"
  default: true

- label: "Show in Popular Hotels Carousel on Homepage?"
  name: "popular"
  widget: "boolean"
  default: true
