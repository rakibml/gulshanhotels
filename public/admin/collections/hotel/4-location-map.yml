# ==========================================
# SECTION 4: LOCATION, ADDRESS & GOOGLE MAP
# ==========================================

- label: "4. LOCATION, PHYSICAL ADDRESS & GOOGLE MAP"
  name: "location_notice"
  widget: "instructions"
  description: "হোটেলের সঠিক শারীরিক ঠিকানা (Google Schema-র জন্য), GPS কোঅর্ডিনেট, গুগল ম্যাপ সার্চ কুয়েরি এবং আশেপাশের দর্শনীয় স্থানসমূহ এখান থেকে নিয়ন্ত্রণ করুন।"
  required: false

# ----------------- ১. ফিজিক্যাল অ্যাড্রেস (গুগল স্কিমার জন্য) -----------------
- label: "Street Address (Road / Plot / Holding)"
  name: "street_address"
  widget: "string"
  required: false
  hint: "যেমন: 'Plot 47, Road 41' বা 'House 15, Block CWN-A' (রাস্তা বা হোল্ডিং নম্বর)"

- label: "Locality / Neighborhood (Area)"
  name: "locality"
  widget: "string"
  required: false
  hint: "যেমন: 'Gulshan-2', 'Gulshan-1', 'Banani' (এটি গুগল স্কিমার addressLocality ওয়ার্নিং দূর করবে)"

- label: "City / Region"
  name: "region"
  widget: "string"
  default: "Dhaka"
  required: false
  hint: "যেমন: 'Dhaka', 'Chittagong'"

- label: "Postal Code"
  name: "postal_code"
  widget: "string"
  required: false
  hint: "যেমন: '1212', '1213' (গুগল স্কিমার postalCode ওয়ার্নিং দূর করবে)"

- label: "Country Code"
  name: "country"
  widget: "string"
  default: "BD"
  required: false
  hint: "ডিফল্ট: 'BD' (বাংলাদেশ)"

# ----------------- ২. জিপিএস ও গুগল ম্যাপ সেটিংস -----------------
- label: "GPS Latitude (Optional)"
  name: "latitude"
  widget: "string"
  required: false
  hint: "যেমন: '23.7925' (সঠিক ম্যাপ পিন এবং Schema geo-র জন্য)"

- label: "GPS Longitude (Optional)"
  name: "longitude"
  widget: "string"
  required: false
  hint: "যেমন: '90.4150' (সঠিক ম্যাপ পিন এবং Schema geo-র জন্য)"

- label: "Custom Google Map Search Query (Optional)"
  name: "map_query"
  widget: "string"
  required: false
  hint: "যেমন: 'Amari Dhaka Gulshan-2'। খালি রাখলে স্বয়ংক্রিয়ভাবে হোটেলের নাম ও ঠিকানা দিয়ে ম্যাপ তৈরি হবে।"

- label: "Google Maps External Direct Link (Optional)"
  name: "map_url"
  widget: "string"
  required: false
  hint: "গুগল ম্যাপ অ্যাপের শেয়ার লিংক। হেডারের 'View location' বাটনে কাজ করবে। খালি রাখলে স্বয়ংক্রিয়ভাবে পেজের ম্যাপে স্ক্রল করবে।"

# ----------------- ৩. আশেপাশের দর্শনীয় স্থান তালিকা -----------------
- label: "Nearby Landmarks & Places List"
  name: "nearby_places"
  widget: "list"
  required: false
  summary: "{{fields.name}} ({{fields.distance}})"
  fields:
    - label: "Landmark / Place Name"
      name: "name"
      widget: "string"
      hint: "যেমন: 'Gulshan Lake Park', 'US Embassy', 'Hazrat Shahjalal International Airport'"

    - label: "Distance / Travel Time"
      name: "distance"
      widget: "string"
      hint: "যেমন: '5 min walk', '10 min drive', '1.5 km'"
