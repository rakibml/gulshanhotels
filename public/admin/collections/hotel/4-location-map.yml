- label: "4. LOCATION & MAP"
  name: "location_notice"
  widget: "instructions"
  description: "Controls custom Google Map search query and nearby landmarks list. (Location address is managed in Section 1)"
  required: false

- label: "Custom Google Map Search Query (Optional)"
  name: "map_query"
  widget: "string"
  required: false
  hint: "e.g. 'The Westin Dhaka Gulshan 2' or coordinates '23.794, 90.413'. Leave blank to use address from Section 1."

- label: "Nearby Landmarks & Places List"
  name: "nearby_places"
  widget: "list"
  required: false
  summary: "{{name}} ({{distance}})"
  fields:
    - label: "Landmark / Place Name (e.g. US Embassy, IVAC Visa Center)"
      name: "name"
      widget: "string"

    - label: "Distance / Travel Time (e.g. 5 min walk or 10 min drive)"
      name: "distance"
      widget: "string"
