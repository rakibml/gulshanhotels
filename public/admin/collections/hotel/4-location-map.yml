- label: "4. LOCATION & GOOGLE MAP"
  name: "location_notice"
  widget: "instructions"
  description: "Controls nearby landmarks and driving times."
  required: false

- label: "Show What's Nearby Section?"
  name: "enable_nearby"
  widget: "boolean"
  default: true

- label: "Nearby Places & Drive Times"
  name: "nearby_places"
  widget: "list"
  required: false
  fields:
    - label: "Landmark Name"
      name: "name"
      widget: "string"
    - label: "Distance / Time"
      name: "distance"
      widget: "string"
