- label: "4. LOCATION, ADDRESS & MAP"
  name: "location_notice"
  widget: "instructions"
  description: "Manage hotel physical address for Google Schema, map coordinates, and nearby landmarks."
  required: false

# ১. রাস্তার সম্পূর্ণ ঠিকানা
- label: "Street Address (Road / Plot / Holding)"
  name: "street_address"
  widget: "string"
  required: false
  hint: "যেমন: 'Plot 47, Road 41' বা 'Gulshan-2' (বিল্ডিং বা রাস্তার নম্বর)"

# ২. এলাকা / লোকালিটি (এটি দিলে Google Schema-র addressLocality ওয়ার্নিং চলে যাবে)
- label: "Locality / Area (Required for Google Schema)"
  name: "locality"
  widget: "string"
  required: false
  hint: "যেমন: 'Gulshan', 'Banani', 'Uttara' (এটি Google Schema-র addressLocality তৈরি করবে)"

# ৩. সিটি / বিভাগ
- label: "City / Region"
  name: "region"
  widget: "string"
  default: "Dhaka"
  required: false
  hint: "যেমন: 'Dhaka', 'Chittagong'"

# ৪. পোস্টাল কোড (এটি দিলে postalCode ওয়ার্নিং দূর হবে)
- label: "Postal Code"
  name: "postal_code"
  widget: "string"
  required: false
  hint: "যেমন: '1212', '1213' (৪ ডিজিটের পোস্ট কোড)"

# ৫. জিপিএস কোঅর্ডিনেট (ম্যাপ ও স্কিমার জন্য)
- label: "GPS Latitude (Optional)"
  name: "latitude"
  widget: "string"
  required: false
  hint: "যেমন: '23.7925'"

- label: "GPS Longitude (Optional)"
  name: "longitude"
  widget: "string"
  required: false
  hint: "যেমন: '90.4150'"

# ৬. গুগল ম্যাপ কাস্টম কুয়েরি
- label: "Custom Google Map Search Query (Optional)"
  name: "map_query"
  widget: "string"
  required: false
  hint: "যেমন: 'The Westin Dhaka Gulshan 2'. খালি রাখলে উপরের ঠিকানা স্বয়ংক্রিয়ভাবে ব্যবহার হবে।"

# ৭. আশেপাশের দর্শনীয় স্থান তালিকা
- label: "Nearby Landmarks & Places List"
  name: "nearby_places"
  widget: "list"
  required: false
  summary: "{{name}} ({{distance}})"
  fields:
    - label: "Landmark / Place Name (e.g. US Embassy, IVAC Visa Center)"
      name: "name"
      widget: "string"

    - label: "Distance / Travel Time (e.g. 5 min walk or 10 min drive)"
      name: "distance"
      widget: "string"
