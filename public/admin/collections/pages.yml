name: "pages"
label: "📄 Pages (About, Legal & Features)"
label_singular: "Page"
folder: "src/content/pages"
create: true
slug: "{{slug}}"
summary: "{{title}} — /{{slug}}"
sortable_fields: ["title"]

fields:
  - label: "Page Title (মূল শিরোনাম যেমন: About Us, Privacy Policy)"
    name: "title"
    widget: "string"

  - label: "URL Slug (যেমন: about, privacy-policy, contact)"
    name: "slug"
    widget: "string"
    hint: "ছোট হাতের অক্ষর ও হাইফেন ব্যবহার করবেন।"

  - label: "Hero Badge Tag (যেমন: Official Directory, Legal Notice)"
    name: "badge"
    widget: "string"
    required: false
    default: "GulshanHotels Official"

  - label: "Short Description / Lead Text (সাব-টাইটেল)"
    name: "description"
    widget: "text"
    required: false

  # ১. বড় কভার ছবি আপলোড করার অপশন
  - label: "Featured Hero Banner Image (বড় কভার ফটো - ঐচ্ছিক)"
    name: "hero_image"
    widget: "image"
    required: false

  # ২. ৪টি হাইলাইট সংখ্যা যোগ করার অপশন (About Us পেজের জন্য)
  - label: "📊 Key Stats Bar (৪টি হাইলাইট সংখ্যা - ঐচ্ছিক)"
    name: "stats"
    widget: "list"
    required: false
    hint: "প্লাস (+) বাটনে ক্লিক করে সংখ্যা ও লেবেল যোগ করুন (যেমন: Value: 50+, Label: Luxury Stays)"
    fields:
      - { label: "Value (যেমন: 50+, 18-Min, 100%)", name: "value", widget: "string" }
      - { label: "Label (যেমন: Luxury Hotels, Airport Transit)", name: "label", widget: "string" }

  # ৩. ফিচার ও ভ্যালু কার্ডসমূহ (৩ কলামের আইকন গ্রিড)
  - label: "🛡️ Feature / Value Cards (ঐচ্ছিক)"
    name: "features"
    widget: "list"
    required: false
    hint: "প্লাস (+) বাটনে চাপ দিয়ে আপনার মূল সেবার কার্ডগুলো যোগ করুন।"
    fields:
      - { label: "Card Title (শিরোনাম)", name: "title", widget: "string" }
      - { label: "Card Description (বিবরণ)", name: "desc", widget: "text" }

  # ৪. মূল লেখার প্যারাগ্রাফ
  - label: "Page Content (মূল লেখা)"
    name: "body"
    widget: "markdown"
    required: false

  # ৫. ইন-পেজ এফএকিউ ড্রপডাউন (ঐচ্ছিক)
  - label: "❓ Page FAQs (ঐচ্ছিক প্রশ্ন-উত্তর)"
    name: "faqs"
    widget: "list"
    required: false
    hint: "প্লাস (+) বাটনে চাপ দিয়ে পেজের জন্য প্রশ্ন ও উত্তর যোগ করুন।"
    fields:
      - { label: "Question (প্রশ্ন)", name: "question", widget: "string" }
      - { label: "Answer (উত্তর)", name: "answer", widget: "text" }

  # ৬. নিচের হোটেল বুকিং ব্যানার অন/অফ সুইচ
  - label: "Show Bottom Hotel Booking CTA Banner?"
    name: "show_cta"
    widget: "boolean"
    default: true
