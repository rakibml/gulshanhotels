name: "pages"
label: "📄 Pages (About, Legal & Policy)"
label_singular: "Page"
folder: "src/content/pages"
create: true
slug: "{{slug}}"
summary: "{{title}} — /{{slug}}"
sortable_fields: ["title"]

fields:
  - label: "Page Title (শিরোনাম যেমন: About Us, Privacy Policy)"
    name: "title"
    widget: "string"

  - label: "URL Slug (যেমন: about, privacy, terms, contact)"
    name: "slug"
    widget: "string"
    hint: "ছোট হাতের অক্ষর ও হাইফেন ব্যবহার করবেন (যেমন: privacy-policy বা about)।"

  - label: "SEO Meta Description (গুগলের জন্য সংক্ষিপ্ত বিবরণ)"
    name: "description"
    widget: "text"

  - label: "Last Updated Date"
    name: "date"
    widget: "datetime"
    date_format: "MMM DD, YYYY"
    time_format: false

  - label: "Page Content (মূল লেখা)"
    name: "body"
    widget: "markdown"
