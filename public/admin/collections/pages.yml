name: "pages"
label: "📄 Pages (About, Legal & Policy)"
label_singular: "Page"
folder: "src/content/pages"
create: true
slug: "{{slug}}"
summary: "{{title}} — /{{slug}}"
sortable_fields: ["title"]

fields:
  - label: "Page Title (যেমন: About Us, Privacy Policy)"
    name: "title"
    widget: "string"

  - label: "URL Slug (যেমন: about, privacy, terms)"
    name: "slug"
    widget: "string"
    hint: "ছোট হাতের অক্ষর ও হাইফেন ব্যবহার করবেন।"

  - label: "Short Description (সংক্ষিপ্ত বিবরণ)"
    name: "description"
    widget: "text"
    required: false

  - label: "Page Content (মূল লেখা)"
    name: "body"
    widget: "markdown"
