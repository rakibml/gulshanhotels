name: "reviews"
label: "💬 Guest Reviews Approval"
label_singular: "Review"
folder: "src/content/reviews"
create: true
slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

# 🎯 ফিক্স: Sveltia CMS এর সঠিক পাইপ (|) টার্নারি সিনট্যাক্স ব্যবহার করা হয়েছে
summary: "{{approved | ternary('✅ Approved', '🔴 NEW / PENDING')}} | {{hotel}} — {{name}} ({{rating}}★)"

sortable_fields: ["date", "hotel", "approved", "rating"]

view_filters:
  - label: "🔴 New / Unapproved Only"
    field: "approved"
    pattern: false
  - label: "✅ Approved Only"
    field: "approved"
    pattern: true

view_groups:
  - label: "Approval Status"
    field: "approved"

fields:
  - { label: "Hotel Name / Title", name: "hotel", widget: "string" }
  - { label: "Reviewer Name", name: "name", widget: "string" }
  - { label: "Rating Stars (1 to 5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
  - { label: "Submitted Date & Time", name: "date", widget: "string" }
  - { label: "Review Comment", name: "comment", widget: "text" }
  - label: "Approve Review to Show Live on Website?"
    name: "approved"
    widget: "boolean"
    default: false
    hint: "Toggle ON and click Publish to make this review live on the website."
