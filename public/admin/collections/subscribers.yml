name: "subscribers"
label: "📧 Subscribers List"
label_singular: "Subscriber"
folder: "src/content/subscribers"
create: false
delete: true

# 🎯 ১. ড্যাশবোর্ডে ইমেইল ও তারিখ স্পষ্টভাবে দেখার জন্য:
identifier_field: "email"
summary: "{{email}} — Subscribed: {{subscribed_at}}"

# 🎯 ২. সার্চ ও সর্টিংয়ের জন্য:
search_fields: ["email"]
sortable_fields: ["subscribed_at", "email"]

fields:
  - label: "Email Address"
    name: "email"
    widget: "string"

  - label: "Subscribed Date"
    name: "subscribed_at"
    widget: "string"
