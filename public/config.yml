backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images/hotels"
public_folder: "/images/hotels"

collections:
  - name: "hotels"
    label: "Hotels Directory"
    folder: "src/content/hotels"
    create: true
    slug: "{{title}}"
    summary: "{{title}} — [ Link: /{{slug}} ]"
    fields:
      # 1. Hotel Name / Title
      - { label: "Hotel Name / Title (e.g. The Westin Dhaka)", name: "title", widget: "string" }
      
      # 2. Hotel Category
      - { label: "Category", name: "category", widget: "string", default: "5-Star Luxury Stay" }
      
      # 3. Location
      - { label: "Location", name: "location", widget: "string", default: "Gulshan 2, Dhaka" }
      
      # 4. Starting Price
      - { label: "Starting Price", name: "price", widget: "string", default: "$120 / night" }
      
      # Real Ratings & Reviews
      - { label: "Rating (e.g. 4.8)", name: "rating", widget: "number", value_type: "float", required: false }
      - { label: "Reviews Count (e.g. 45)", name: "reviewsCount", widget: "number", required: false }
      
      # Images
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Photo Gallery", name: "gallery", widget: "list", field: { label: "Image", widget: "image" }, required: false }
      
      # Booking Action Channels (Full Admin Control)
      - { label: "Show OTA Rate Comparison Table (Agoda, Booking, Expedia)?", name: "enable_rates", widget: "boolean", default: true }
      - { label: "Official Hotel Website Link (Optional)", name: "officialSite", widget: "string", required: false }
      - { label: "WhatsApp Reservation Number (e.g. 8801700000000)", name: "whatsapp", widget: "string", required: false }
      - { label: "Direct Phone Number (e.g. +8801700000000)", name: "phone", widget: "string", required: false }

      # Section Toggles
      - { label: "Show Amenities Section?", name: "enable_amenities", widget: "boolean", default: true }
      - { label: "Show What's Nearby?", name: "enable_nearby", widget: "boolean", default: true }
      - { label: "Show Essential Details?", name: "enable_details", widget: "boolean", default: true }
      - { label: "Show House Rules?", name: "enable_rules", widget: "boolean", default: true }
      - { label: "Show FAQs?", name: "enable_faqs", widget: "boolean", default: true }

      # Dynamic Lists
      - label: "Amenities List"
        name: "amenities"
        widget: "list"
        required: false
        field: { label: "Amenity Name", widget: "string" }

      - label: "Nearby Places"
        name: "nearby_places"
        widget: "list"
        required: false
        fields:
          - { label: "Place Name", name: "name", widget: "string" }
          - { label: "Distance (e.g. 200m)", name: "distance", widget: "string" }
          - { label: "Landmark Details / Tips", name: "details", widget: "text", required: false }

      - label: "Frequently Asked Questions"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

      # Custom Extra Sections
      - label: "Custom Additional Sections"
        name: "custom_sections"
        widget: "list"
        required: false
        fields:
          - { label: "Section Title", name: "title", widget: "string" }
          - { label: "Section Content / Body", name: "content", widget: "markdown" }

      # Overview Description
      - { label: "Hotel Description", name: "body", widget: "markdown" }
