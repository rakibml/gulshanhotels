backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  # 1. Homepage Sponsored Showcase Collection (আগের মতো হুবহু অপরিবর্তিত)
  - name: "sponsored"
    label: "⭐ Homepage Sponsored Showcase"
    folder: "src/content/sponsored"
    create: true
    slug: "current-sponsor"
    fields:
      - { label: "Enable Showcase on Homepage", name: "enable", widget: "boolean", default: true }
      - { label: "Badge Text (e.g. ⭐ Editor's Choice / 🔥 Sponsored)", name: "badge", widget: "string", default: "⭐ Editor's Choice" }
      - { label: "Hotel / Sponsor Name", name: "title", widget: "string", default: "The Westin Dhaka" }
      - { label: "Sub-tag / Category", name: "category", widget: "string", default: "5-Star Luxury • Gulshan 2" }
      - { label: "Star Rating (1 to 5)", name: "rating", widget: "number", value_type: "float", default: 4.8 }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Button Text (e.g. Check Best Deal / Visit Hotel)", name: "buttonText", widget: "string", default: "Check Best Deal ➔" }
      - { label: "Button Target Link (Agoda/Sponsor URL)", name: "buttonLink", widget: "string", default: "https://agoda.com" }

  # 2. Hotels Collection (নতুন ফিচারসমূহ আপডেটেড)
  - name: "hotels"
    label: "Hotels List"
    folder: "src/content/hotels"
    create: true
    slug: "{{slug}}"
    fields:
      # ১. সাধারণ তথ্য (Basic Info)
      - { label: "Hotel Name", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["5-Star Luxury", "4-Star Boutique", "3-Star Hotel", "Serviced Apartment", "Budget Stay"] }
      - { label: "Location Tag", name: "location", widget: "string", default: "Gulshan 2, Dhaka" }
      - { label: "Full Address", name: "fullAddress", widget: "string", default: "Road 112, Gulshan 2, Diplomatic Zone, Dhaka 1212" }
      - { label: "Price BDT", name: "priceBDT", widget: "string", default: "৳৪,৫০—" }
      - { label: "Price USD", name: "priceUSD", widget: "string", default: "$50" }
      - { label: "Star Rating", name: "rating", widget: "number", value_type: "float", default: 4.8 }
      - { label: "Reviews Count", name: "reviewsCount", widget: "string", default: "48" }

      # ২. ছবি আপলোড (Images & Gallery)
      - { label: "Featured Image", name: "image", widget: "image" }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        field: { label: "Image", name: "img", widget: "image" }

      # ৩. সরাসরি কন্টাক্ট (Direct Contacts)
      - { label: "Direct Phone Number", name: "phone", widget: "string", default: "+880 1700-000000" }
      - { label: "Direct WhatsApp Number", name: "whatsapp", widget: "string", default: "8801700000000" }
      - { label: "Official Website Link", name: "officialWebsite", widget: "string", default: "https://oceanviewresort.com" }
      - { label: "Google Map Embed URL", name: "mapEmbedUrl", widget: "string", required: false }

      # ৪. হোটেলের বিবরণ (Overview & Notes)
      - { label: "Editor Inspection Note", name: "editorNote", widget: "text", required: false }
      - { label: "Full Hotel Review & Features", name: "body", widget: "markdown" }

      # 📂 ৫. আশেপাশের স্থান (Nearby Landmarks & Distances)
      - label: "Nearby Landmarks & Distances"
        name: "landmarks"
        widget: "list"
        required: false
        fields:
          - { label: "Landmark Name", name: "name", widget: "string" }
          - { label: "Category", name: "category", widget: "select", options: ["Dining / Bars", "Attractions", "Business & Medical"] }
          - { label: "Distance Text", name: "distance", widget: "string", hint: "Example: Adjacent (200 m) or 1.1 mi" }

      # 📂 ৬. ফিচার্ড সুযোগ-সুবিধা (Featured Amenities)
      - label: "Featured Amenities"
        name: "amenities"
        widget: "list"
        required: false
        field: { label: "Amenity Name", name: "item", widget: "string" }

      # 📂 ৭. হাউস রুলস (House Rules)
      - label: "House Rules"
        name: "houseRules"
        widget: "object"
        required: false
        fields:
          - { label: "Check-In Time", name: "checkIn", widget: "string", default: "From 12:00 PM to 00:00 AM" }
          - { label: "Check-Out Time", name: "checkOut", widget: "string", default: "From 06:00 AM to 11:00 AM" }
          - { label: "Cancellation Policy", name: "cancellation", widget: "text", default: "Cancellation and prepayment policies vary according to accommodation type." }
          - { label: "Children & Beds Policy", name: "children", widget: "text", default: "Children of any age are welcome." }
          - { label: "Pets Policy", name: "pets", widget: "string", default: "Pets are not allowed." }
          - { label: "Payment Options", name: "payment", widget: "string", default: "Accepts Cash, Credit Cards (Visa/MasterCard), bKash, and Nagad." }

      # 📂 ৮. হোটেল প্রশ্নাবলী (Hotel FAQs)
      - label: "Hotel FAQs"
        name: "faqs"
        widget: "list"
        required: false
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }

      # 📂 ৯. কাস্টমার রিভিউ (Guest Reviews)
      - label: "Guest Reviews"
        name: "reviews"
        widget: "list"
        required: false
        fields:
          - { label: "Guest Name", name: "author", widget: "string" }
          - { label: "Stay Date", name: "date", widget: "string" }
          - { label: "Review Comment", name: "comment", widget: "text" }
