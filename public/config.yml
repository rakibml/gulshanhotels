backend:
  name: github
  repo: rakibml/gulshanhotels
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "hotels"
    label: "Hotels List"
    folder: "src/content/hotels"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Hotel Name", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["5-Star Luxury", "5-Star Premium", "4-Star Boutique", "3-Star Hotel", "Serviced Apartment", "Budget Stay"] }
      - { label: "Short Location Tag", name: "location", widget: "string", default: "Gulshan 2, Dhaka" }
      - { label: "Full Address", name: "fullAddress", widget: "string", default: "Main Gulshan Avenue, Gulshan 2, Dhaka 1212" }
      - { label: "Price BDT (e.g. ৳১৫,০০০)", name: "priceBDT", widget: "string", default: "৳১৫,০০০" }
      - { label: "Price USD (e.g. $130)", name: "priceUSD", widget: "string", default: "$130" }
      - { label: "Star Rating (1 to 5)", name: "rating", widget: "number", value_type: "float", default: 4.8 }
      - { label: "Reviews Count (e.g. 120)", name: "reviewsCount", widget: "string", default: "120" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Official Hotel Website Link", name: "officialWebsite", widget: "string", default: "https://agoda.com" }
      - { label: "Hotel Phone Number", name: "phone", widget: "string", default: "+880 1700-000000" }
      - { label: "Amenities List", name: "amenities", widget: "list", default: ["Indoor Heated Pool", "Free WiFi", "24/7 Power Generator", "Free Breakfast", "Airport Shuttle"] }
      - { label: "Show in Popular Hotels Section on Homepage", name: "popular", widget: "boolean", default: true }
      - { label: "Full Hotel Review and Description", name: "body", widget: "markdown" }
